<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rival — VideoCuts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" />
<link rel="stylesheet" href="../assets/app.css" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
<link rel="icon" href="../assets/icons/favicon-32.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="VideoCuts" />
<meta name="theme-color" content="#0d0d0d" />
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js')</script>
<style>
  .tabs { display: flex; gap: 6px; padding: 0 20px; border-bottom: 1px solid #2a2a2a; }
  .tab-btn {
    background: transparent; border: none; border-bottom: 2px solid transparent;
    color: #888; padding: 12px 6px; font-size: 13px; cursor: pointer;
  }
  .tab-btn.active { color: #fff; border-bottom-color: #9085e9; }
  .tab-panel { min-height: 0; }

  /* ── Filtros (izquierda) + visualizadores (derecha) ── */
  .dash-layout { display: flex; align-items: flex-start; }
  .dash-filters {
    width: 280px; flex-shrink: 0; border-right: 1px solid #2a2a2a;
    padding: 18px 16px; display: flex; flex-direction: column; gap: 14px;
    box-sizing: border-box;
    /* Solo sticky, sin overflow/max-height: un overflow aquí recortaría los
       desplegables de filtro, que se abren hacia abajo por fuera de esta
       columna (position:absolute) — el recorte no distingue que son "parte"
       del contenido flotante y los corta igual que si fueran texto normal. */
    position: sticky; top: 0;
  }
  .dash-filters-title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .dash-filters-title { color: #aaa; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  .filters-reset {
    background: none; border: 1px solid var(--border); color: var(--text-secondary); font-size: 11px;
    cursor: pointer; padding: 5px 12px; border-radius: 999px; font-family: inherit;
  }
  .filters-reset:hover { border-color: var(--accent); color: #fff; }
  .filters-col { display: flex; flex-direction: column; gap: 10px; }
  .filters-col .dd-filter { display: block; }
  .filters-col .dd-filter-btn { width: 100%; box-sizing: border-box; justify-content: space-between; }
  .dash-main { flex: 1; min-width: 0; padding: 20px; }

  /* El botón para mostrar/ocultar filtros vale para cualquier tamaño de
     pantalla (antes solo existía en móvil) — en escritorio/tablet permite
     ganar ancho para las gráficas; en móvil sigue siendo el único acceso
     a los filtros. El estado (mostrado/ocultado) se recuerda en
     localStorage, ver setupFiltersToggle. */
  .filters-toggle {
    display: block; width: 100%; text-align: left; background: #1a1a1a; border: none;
    border-bottom: 1px solid #2a2a2a; color: #ccc; padding: 10px 20px; font-size: 13px; cursor: pointer;
  }
  .filters-toggle:hover { color: #fff; }
  .dash-filters.is-hidden { display: none; }

  @media (max-width: 860px) {
    /* align-items:flex-start (para el modo fila, en escritorio) pasa a
       controlar el ancho de las columnas al volverse el eje transversal en
       modo columna — sin stretch, cada panel se encoge a su contenido y lo
       que no quepa (p.ej. la tabla de detalle) se escapa de la página en
       vez de scrollear dentro de su propio contenedor. */
    .dash-layout { flex-direction: column; align-items: stretch; }
    .dash-filters {
      width: 100%; border-right: none; border-bottom: 1px solid #2a2a2a; box-sizing: border-box;
      position: static;
    }
  }

  /* ── Pestaña Jugadores: filtros arriba (a todo el ancho, colapsables como
     cualquier otro panel) en vez de barra lateral fija, y dos columnas
     debajo — deja hueco a la derecha para los Clips (siguiente etapa); de
     momento ahí vive la tabla de detalle. La pestaña Portero sigue con el
     esquema .dash-layout/.dash-filters de siempre, sin tocar. ── */
  .jug-wrap { display: flex; flex-direction: column; gap: 18px; padding: 18px 20px 30px; }
  .filters-row { display: flex; flex-wrap: wrap; gap: 10px; }
  .jug-layout { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.05fr); gap: 18px; align-items: start; }
  .jug-col-a, .jug-col-b { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  @media (max-width: 900px) {
    .jug-layout { grid-template-columns: minmax(0,1fr); }
  }

  /* ── Filtros "inmediatos" (Jornada/Resultado/Modalidad): chips visibles
     de un vistazo, sin abrir nada — reutiliza .chip-group/.chip de
     app.css. Los de más variedad (Fase, Mano, Tipo...) se quedan como
     desplegables, agrupados debajo tras el divisor. ── */
  .filters-tier { display: flex; gap: 22px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip-group { gap: 5px; }
  .chip-group .group-label { margin-top: 0; }
  .chip-group > div { display: contents; }
  .chip-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 5px; vertical-align: middle; }
  .filters-divider { height: 1px; background: #2a2a2a; margin: 0 0 10px; }
  #filtersPanel.panel { padding: 13px 18px; }
  #filtersPanel .panel-title-row { margin-bottom: 8px; }
  #filtersPanel .dash-filters-title { margin-bottom: 6px !important; }

  /* ── Resumen: tarjetas grandes en vez de cifras en línea ── */
  .stat-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat-tile { background: var(--surface-alt); border-radius: 10px; padding: 13px; min-width: 0; }
  .stat-tile .stat-value {
    font-family: var(--font-display); font-size: 26px; font-weight: 600; color: var(--accent);
    font-variant-numeric: tabular-nums; line-height: 1.1;
  }
  .stat-tile .stat-label { font-size: 10.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; margin-top: 5px; }

  /* ── Comparativa de jugadores: barras dobles (lanzamientos/goles)
     apiladas por jugador en vez de un gráfico de barras agrupadas — se
     lee mejor en una columna estrecha y sigue actuando como filtro
     clicable (togglePlayerFilter, sin cambios). ── */
  .scorer-row { padding: 9px 10px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; margin-bottom: 6px; transition: background .12s, border-color .12s; }
  .scorer-row:last-child { margin-bottom: 0; }
  .scorer-row:hover { background: rgba(255,255,255,0.04); }
  .scorer-row.active { background: var(--accent-soft); border-color: var(--accent); }
  .scorer-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 12.5px; margin-bottom: 6px; }
  .scorer-name { color: #fff; font-weight: 600; }
  .scorer-eff { color: var(--text-muted); font-family: var(--font-mono); font-size: 11px; }
  .scorer-row.active .scorer-eff { color: var(--text-secondary); }
  .scorer-bars { display: flex; flex-direction: column; }
  .scorer-bar-track { background: rgba(255,255,255,0.06); height: 6px; overflow: hidden; }
  .scorer-bar-track:first-child { border-radius: 4px 4px 0 0; }
  .scorer-bar-track:last-child { border-radius: 0 0 4px 4px; margin-top: 1px; }
  .scorer-bar-fill { height: 100%; }
  .scorer-bar-fill.lanz { background: var(--accent); }
  .scorer-bar-fill.gol { background: #d95926; }
  .scorer-figures { display: flex; gap: 12px; margin-top: 6px; font-size: 10.5px; color: var(--text-muted); font-family: var(--font-mono); }

  /* ── Clips: rejilla de miniaturas reales de YouTube (Etapa 3) — sustituye
     a la tabla de detalle como forma principal de abrir un vídeo; la tabla
     pasa a una sección "ver tabla completa" colapsada, a todo lo ancho,
     debajo de las dos columnas (mismo patrón que el prototipo). ── */
  .clips-count { font-size: 11px; color: var(--text-muted); }
  .filmstrip { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap: 12px; }
  .clip-card { min-width: 0; cursor: pointer; background: none; border: none; padding: 0; text-align: left; font-family: inherit; color: inherit; }
  .clip-thumb { position: relative; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); background: var(--surface-alt); }
  .clip-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .clip-play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #fff; text-shadow: 0 1px 5px rgba(0,0,0,.7); opacity: .9; transition: transform .12s; }
  .clip-card:hover .clip-play { transform: scale(1.12); }
  .clip-time { position: absolute; bottom: 6px; right: 6px; font-family: var(--font-mono); font-size: 10px; background: rgba(0,0,0,.65); padding: 1px 5px; border-radius: 4px; color: #fff; }
  .clip-meta { display: flex; align-items: center; gap: 6px; margin-top: 7px; }
  .clip-player { font-size: 11px; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .clip-sub { font-size: 10.5px; color: var(--text-muted); margin-top: 3px; }
  .clips-more { grid-column: 1 / -1; font-size: 11px; color: var(--text-muted); text-align: center; padding-top: 4px; }

  .table-toggle { background: none; border: none; color: var(--accent); font-size: 12px; cursor: pointer; padding: 2px 0; font-family: inherit; font-weight: 600; }
  .table-wrap { margin-top: 12px; }

  /* ── Modal de corrección de una jugada ── */
  .correct-modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200;
    display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box;
  }
  .correct-modal-overlay[hidden] { display: none; }
  .correct-modal {
    width: 100%; max-width: 520px; max-height: 100%; overflow-y: auto;
    background: var(--surface); border-radius: 10px; padding: 18px 20px 20px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .correct-modal-header { display: flex; align-items: center; justify-content: space-between; }
  .correct-modal-header h2 { font-size: 16px; }
  .correct-modal-hint { color: var(--text-muted); font-size: 12px; line-height: 1.5; margin: 0; }
  .correct-modal-fields { display: flex; flex-direction: column; gap: 12px; }
  .correct-field-row { display: flex; gap: 12px; }
  .correct-field-row .correct-field { flex: 1; min-width: 0; }
  @media (max-width: 480px) { .correct-field-row { flex-direction: column; gap: 12px; } }
  .correct-field label {
    display: block; color: var(--text-secondary); font-size: 11.5px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .03em; margin-bottom: 5px;
  }
  .correct-field select, .correct-field input[type=text] {
    width: 100%; box-sizing: border-box; background: var(--surface-alt); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text-primary); font-size: 13px; padding: 7px 9px; font-family: inherit;
  }
  .correct-field select:focus, .correct-field input[type=text]:focus { outline: none; border-color: var(--accent); }
  .correct-field input[type=text] { margin-top: 6px; }
  .correct-field.is-changed label { color: var(--accent-text); }
  .correct-modal-footer { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
  .correct-modal-feedback { flex: 1; font-size: 12px; color: #4fd37a; }
  .correct-modal-feedback.is-error { color: #f27a7a; }
  .correct-modal-save {
    background: var(--accent); color: #17141f; border: none; border-radius: 6px;
    padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .correct-modal-save:disabled { opacity: .5; cursor: default; }
  .corrected-badge {
    display: inline-block; font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em;
    color: var(--accent-text); background: var(--accent-soft); border: 1px solid var(--accent-border);
    border-radius: 999px; padding: 1px 7px; margin-left: 6px; vertical-align: middle;
  }
</style>
</head>
<body>
  <header class="site-header">
    <a class="back" href="index.html">← Mis equipos</a>
    <h1 id="teamName">Cargando…</h1>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-tab="jugadores">Jugadores</button>
    <button class="tab-btn" data-tab="portero">Portero</button>
  </div>
  <div class="tab-panel" id="tab-jugadores"></div>
  <div class="tab-panel" id="tab-portero" hidden></div>

  <!-- Modal de vídeo: compartido por las dos pestañas (jugadores y
       portero) — si viviera dentro de la plantilla de una sola, la otra no
       podría usarlo. -->
  <div class="video-modal-overlay" id="videoModalOverlay" hidden>
    <div class="video-modal">
      <div class="video-modal-bar">
        <div class="video-modal-nav">
          <button type="button" class="video-modal-navbtn" id="videoModalPrev">◀ Anterior</button>
          <button type="button" class="video-modal-navbtn" id="videoModalReplay">↻ Volver a ver</button>
          <button type="button" class="video-modal-navbtn" id="videoModalPlayPause" title="Pausar">⏸</button>
          <button type="button" class="video-modal-navbtn" id="videoModalNext">Siguiente ▶</button>
        </div>
        <div class="video-modal-toggles">
          <button type="button" class="video-modal-icontoggle" id="videoModalAutoAdvance"
            aria-pressed="true" title="Pasar automáticamente al siguiente vídeo al terminar">🔁</button>
          <button type="button" class="video-modal-icontoggle" id="videoModalShowInfo"
            aria-pressed="false" title="Mostrar información del lanzamiento">ℹ️</button>
          <button type="button" class="video-modal-icontoggle" id="videoModalShowGoalZone"
            aria-pressed="false" title="Mostrar zona de portería sobre el vídeo">🥅</button>
          <button type="button" class="video-modal-icontoggle" id="videoModalCorrect"
            title="Corregir los datos de esta jugada">✎</button>
        </div>
        <button type="button" class="video-modal-close" id="videoModalClose">✕</button>
      </div>
      <div class="video-modal-body" id="videoModalBody">
        <div class="video-modal-frame" id="videoModalFrame">
          <!-- Envoltorio propio porque la API de YouTube SUSTITUYE el elemento
               #videoModalPlayer entero por un <iframe> (mismo id, nodo nuevo) en
               cuanto se crea el reproductor — si el JS guardara una referencia a
               #videoModalPlayer para mostrarlo/ocultarlo, a partir de ese momento
               apuntaría a un nodo ya fuera del DOM. Ocultando este envoltorio (que
               la API nunca toca) en vez del propio player, siempre funciona. -->
          <div id="videoModalYtWrap">
            <div id="videoModalPlayer"></div>
          </div>
          <video id="videoModalNativeVideo" playsinline hidden></video>
          <div class="video-modal-goalzone-overlay" id="videoModalGoalZoneOverlay" hidden></div>
        </div>
        <div class="video-modal-info" id="videoModalInfo"></div>
      </div>
    </div>
  </div>

  <!-- Modal de corrección de una jugada — por encima del modal de vídeo
       (z-index más alto), se rellena entero por JS (ver openCorrectModal). -->
  <div class="correct-modal-overlay" id="correctModalOverlay" hidden>
    <div class="correct-modal">
      <div class="correct-modal-header">
        <h2>Corregir jugada</h2>
        <button type="button" class="video-modal-close" id="correctModalClose">✕</button>
      </div>
      <p class="correct-modal-hint">
        Esto no cambia el vídeo ni lo publicado desde VideoCuts — guarda tu corrección aparte, y se
        muestra en lugar del valor original. Quien gestiona el canal verá un aviso si vuelve a publicar
        este partido, por si hay que tenerlo en cuenta.
      </p>
      <div class="correct-modal-fields" id="correctModalFields"></div>
      <div class="correct-modal-footer">
        <span class="correct-modal-feedback" id="correctModalFeedback"></span>
        <button type="button" class="video-modal-navbtn" id="correctModalCancel">Cancelar</button>
        <button type="button" class="correct-modal-save" id="correctModalSave">Guardar correcciones</button>
      </div>
    </div>
  </div>

  <!-- API de YouTube: permite controlar el reproductor del modal de vídeo
       (volver a ver, avanzar al siguiente corte al terminar el actual) sin
       depender solo de los parámetros de la URL del iframe. -->
  <script src="https://www.youtube.com/iframe_api"></script>

<script type="module">
  import { escapeHtml } from '../assets/app.js'
  import { createDropdownFilter, createTreeDropdownFilter, buildTimeTree, computeTimeBucketKey } from '../assets/dropdown-filter.js'
  import { SHOT_ZONES, COURT_W, COURT_H, GOAL_INNER_ZONES, GOAL_LABELS, GOAL_LAYOUT } from '../assets/zones.js'
  import { requireSession, fetchTeamRecords, getChannelName, fetchFieldOptions, fetchCorrections, saveCorrections } from '../assets/supabase.js'

  const COL_PLAYER = 'Jugador'
  const COL_CODE = 'Codigo'
  const COL_POSITION = 'Posición'
  const COL_GOAL = 'Portería'
  const COL_PUESTO = 'Puesto'
  const COL_YOUTUBE = 'ID de YouTube del vídeo'
  const COL_CLIP_START = 'Inicio del corte (segundos)'
  const COL_CLIP_END = 'Fin del corte (segundos)'
  // Vídeo propio en Cloudflare R2 (alternativa a YouTube) — opcionales,
  // solo rellenas si desde VideoCuts se subió el vídeo de ese rol (ver
  // hostedVideoService.ts). Si faltan, el corte se ve por YouTube como
  // siempre; ver openVideoModal.
  const COL_HOSTED_URL = 'URL del vídeo propio'
  const COL_HOSTED_START = 'Inicio del corte en el vídeo propio (segundos)'
  const COL_HOSTED_END = 'Fin del corte en el vídeo propio (segundos)'
  const COL_GK_POSITION = 'Posición portero'
  const COL_GK_STANCE = 'Postura portero'
  const COL_EVENT_ID = 'ID del corte (técnico)'

  // Columnas técnicas/identificadoras: no tiene sentido "corregirlas" desde
  // el viewer (son ids, o ya se corrigen indirectamente cambiando otra
  // cosa) — se excluyen del formulario de corrección (ver openCorrectModal).
  // "Equipo" también: esta página ya está fija a un equipo (?equipo= en la
  // URL), no se puede cambiar desde aquí.
  const CORRECTION_EXCLUDED_FIELDS = new Set([
    COL_CODE, COL_EVENT_ID, 'ID del partido (técnico)', 'Equipo',
    COL_YOUTUBE, COL_CLIP_START, COL_CLIP_END,
    COL_HOSTED_URL, COL_HOSTED_START, COL_HOSTED_END
  ])

  // Orden/agrupación del formulario de corrección — no el orden en que
  // vienen las columnas del CSV, que no es el más natural para leerlo aquí
  // (p.ej. "Parte" y "Tiempo de partido" van juntos, "Jugador" y "Puesto"
  // también). Cada fila puede llevar uno o dos campos (se ven en la misma
  // línea). Un campo que no aparezca aquí (de una plantilla nueva, p.ej.)
  // simplemente se añade al final, en vez de desaparecer.
  const CORRECTION_FIELD_LAYOUT = [
    ['Tipo de evento'],
    ['Parte', 'Tiempo de partido'],
    [COL_PLAYER, COL_PUESTO],
    ['Resultado'],
    [COL_POSITION, COL_GOAL],
    ['Mano', 'Tipo de lanzamiento'],
    ['Fase de juego'],
    ['Con amago'],
    [COL_GK_POSITION, 'Lanzamiento 7M'],
    ['Contraataque', COL_GK_STANCE]
  ]

  // Pide las correcciones ya guardadas de un canal+rol y las superpone en
  // memoria sobre los registros publicados (mutando cada fila in-place, así
  // que también lo ven filtros/estadísticas/listados, no solo el modal de
  // vídeo) — "_corrected" marca qué campos tiene corregidos esa fila, para
  // poder mostrar el aviso visual (ver openVideoModal/videoModalInfo).
  async function applyCorrections(records, channelId, role) {
    if (records.length === 0) return
    let corrections
    try {
      corrections = await fetchCorrections(channelId, role)
    } catch {
      return // no bloquea la carga de la pestaña si esto falla
    }
    if (corrections.length === 0) return
    const byEvent = new Map()
    for (const c of corrections) {
      if (!byEvent.has(c.event_id)) byEvent.set(c.event_id, {})
      byEvent.get(c.event_id)[c.field] = c.new_value
    }
    for (const r of records) {
      const fixes = byEvent.get(r[COL_EVENT_ID])
      if (fixes) {
        Object.assign(r, fixes)
        r._corrected = new Set(Object.keys(fixes))
      }
    }
  }

  // Mismos códigos y orden que en VideoCuts (shared/types.ts): de un extremo
  // al otro de la pista, con portero y pivote en medio. No incluye DF
  // (especialista defensivo): ese jugador prácticamente no lanza.
  const POSITION_ORDER = ['EI', 'LI', 'PI', 'PT', 'CT', 'LD', 'ED']
  const POSITION_LABELS = {
    EI: 'Extremo izquierdo', LI: 'Lateral izquierdo', PI: 'Pivote', PT: 'Portero',
    CT: 'Central', LD: 'Lateral derecho', ED: 'Extremo derecho'
  }
  // El CSV trae el nombre completo ("Extremo izquierdo"), no el código — el
  // desplegable de la plantilla exporta la etiqueta, igual que "Mano". Un
  // valor antiguo (texto libre de antes de que el puesto fuera una lista
  // cerrada, p.ej. "CE") simplemente no encuentra código y cuenta como "sin
  // puesto definido", en vez de romper nada.
  const POSITION_LABEL_TO_CODE = Object.fromEntries(Object.entries(POSITION_LABELS).map(([code, label]) => [label, code]))

  // El CSV trae "#33 NOMBRE" — para el desplegable interesa ordenar por
  // dorsal numérico (no como texto: "#10" iría antes que "#2") y sin el "#",
  // que no aporta nada y ocupa espacio.
  function parsePlayer(raw) {
    const m = raw.match(/^#(\d+)\s*(.*)$/)
    if (!m) return { dorsal: Infinity, label: raw }
    return { dorsal: Number(m[1]), label: `${m[1]} ${m[2]}`.trim() }
  }

  // Mostrar/ocultar el panel de filtros: en escritorio/tablet por defecto
  // se ven (para no sorprender a quien ya usaba la página), en móvil por
  // defecto se ocultan (como hasta ahora, hacen falta para ver las
  // gráficas en una pantalla pequeña) — salvo que el usuario ya haya
  // elegido explícitamente lo contrario, lo que se recuerda entre
  // visitas. Un único ajuste compartido por las dos pestañas: quien
  // oculta los filtros probablemente los quiere ocultos en las dos.
  function setupFiltersToggle(toggleBtn, filtersEl) {
    const STORAGE_KEY = 'vv_filtersOpen'
    const isNarrow = () => window.matchMedia('(max-width: 860px)').matches

    function readVisible() {
      let saved = null
      try { saved = localStorage.getItem(STORAGE_KEY) } catch {}
      if (saved === '1') return true
      if (saved === '0') return false
      return !isNarrow()
    }

    function apply(visible) {
      filtersEl.classList.toggle('is-hidden', !visible)
      toggleBtn.textContent = visible ? '☰ Ocultar filtros' : '☰ Mostrar filtros'
    }

    let visible = readVisible()
    apply(visible)
    toggleBtn.addEventListener('click', () => {
      visible = !visible
      try { localStorage.setItem(STORAGE_KEY, visible ? '1' : '0') } catch {}
      apply(visible)
    })
  }

  // Zonas de los mapas de calor (lanzamiento y portería, en las dos
  // pestañas): un clic añade/quita esa zona de la selección — se puede
  // filtrar por varias a la vez (p.ej. las dos zonas de extremo izquierdo).
  // Doble clic dice "solo esta" (descarta las demás); en pantallas
  // táctiles no hay doble clic, así que el gesto equivalente es mantener
  // pulsado.
  //
  // "solo esta" vuelve a pintar el gráfico entero (nuevos elementos, con
  // sus propios listeners) antes de que el dedo se levante — un flag local
  // por elemento no sobrevive a eso, así que para evitar el "click
  // fantasma" que el navegador dispara tras soltar una pulsación larga se
  // usa un margen de tiempo compartido, no atado a un elemento concreto.
  let recentLongPressAt = 0
  function wireZoneInteractions(elements, { onToggle, onSelectOnly }) {
    const LONG_PRESS_MS = 500
    const CLICK_SUPPRESS_MS = 400
    elements.forEach((el) => {
      const code = el.dataset.code
      let pressTimer = null

      el.addEventListener('click', () => {
        if (Date.now() - recentLongPressAt < CLICK_SUPPRESS_MS) return
        onToggle(code)
      })
      el.addEventListener('dblclick', (e) => {
        e.preventDefault()
        onSelectOnly(code)
      })
      el.addEventListener('pointerdown', (e) => {
        if (e.pointerType !== 'touch') return // el ratón ya tiene doble clic
        pressTimer = setTimeout(() => { recentLongPressAt = Date.now(); onSelectOnly(code) }, LONG_PRESS_MS)
      })
      const cancelPress = () => { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null } }
      el.addEventListener('pointerup', cancelPress)
      el.addEventListener('pointercancel', cancelPress)
      el.addEventListener('pointerleave', cancelPress)
    })
  }

  // ── Utilidades compartidas por las dos pestañas (jugadores y portero):
  // extraer el código de una zona ("2 · Extremo..." → "2"/"Extremo..."), y
  // el degradado rojo→amarillo→verde por % de efectividad (o de paradas,
  // en portero — el cálculo de qué % se le pasa cambia, pero el color y el
  // contraste del texto son los mismos). ──
  function parseZoneCode(pos) {
    const m = (pos || '').match(/^\s*(\S+)\s*·/)
    return m ? m[1] : null
  }
  function formatZoneLabel(pos) {
    const m = (pos || '').match(/^\s*\S+\s*·\s*(.+)$/)
    return m ? m[1] : ''
  }
  function zoneCentroid(points) {
    const cx = points.reduce((s, p) => s + p.x, 0) / points.length
    const cy = points.reduce((s, p) => s + p.y, 0) / points.length
    return { cx, cy }
  }
  function lerpChannel(a, b, t) { return Math.round(a + (b - a) * t) }
  function mixColorRGB(c1, c2, t) {
    return [lerpChannel(c1[0], c2[0], t), lerpChannel(c1[1], c2[1], t), lerpChannel(c1[2], c2[2], t)]
  }
  function rgbStr(c) { return `rgb(${c[0]},${c[1]},${c[2]})` }
  function efficiencyColorRGB(pct) {
    const RED = [208, 59, 59], YELLOW = [250, 178, 25], GREEN = [12, 163, 12]
    const t = Math.max(0, Math.min(100, pct))
    return t <= 50 ? mixColorRGB(RED, YELLOW, t / 50) : mixColorRGB(YELLOW, GREEN, (t - 50) / 50)
  }
  function efficiencyColor(pct) { return rgbStr(efficiencyColorRGB(pct)) }
  function textColorOn(rgb) {
    const luminance = 0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2]
    return luminance > 150 ? '#1a1a1a' : '#fff'
  }
  function niceMax(value) {
    return value <= 0 ? 5 : Math.ceil(value / 5) * 5
  }
  // El CSV trae la etiqueta completa de la zona de portería ("Medio
  // derecha"), no el código interno que usa GOAL_LAYOUT — mismo mapeo que
  // usan tanto jugadores como portero.
  const GOAL_LABEL_TO_CODE = Object.fromEntries(Object.entries(GOAL_LABELS).map(([code, label]) => [label, code]))

  // ── Modal de vídeo: compartido por las pestañas de jugadores y portero.
  // Cada pestaña rellena currentVideoRows con su propia tabla de detalle
  // (filtrada/ordenada a su manera) y llama a openVideoModal(record, index).
  const videoModalOverlay = document.getElementById('videoModalOverlay');
  const videoModalPrev = document.getElementById('videoModalPrev');
  const videoModalNext = document.getElementById('videoModalNext');
  const videoModalReplay = document.getElementById('videoModalReplay');
  const videoModalPlayPause = document.getElementById('videoModalPlayPause');
  const videoModalAutoAdvance = document.getElementById('videoModalAutoAdvance');
  const videoModalShowInfo = document.getElementById('videoModalShowInfo');
  const videoModalShowGoalZone = document.getElementById('videoModalShowGoalZone');
  const videoModalInfo = document.getElementById('videoModalInfo');
  const videoModalGoalZoneOverlay = document.getElementById('videoModalGoalZoneOverlay');
  const videoModalFrame = document.getElementById('videoModalFrame');
  const videoModalYtWrap = document.getElementById('videoModalYtWrap');
  const videoModalNativeVideo = document.getElementById('videoModalNativeVideo');
  const videoModalBody = document.getElementById('videoModalBody');
  document.getElementById('videoModalClose').addEventListener('click', closeVideoModal);
  videoModalOverlay.addEventListener('click', (e) => { if (e.target === videoModalOverlay) closeVideoModal(); });
  videoModalPrev.addEventListener('click', () => goToVideo(-1));
  videoModalNext.addEventListener('click', () => goToVideo(1));
  videoModalReplay.addEventListener('click', replayVideo);

  // Icono según lo que esté haciendo el reproductor activo (nativo o
  // YouTube) — se llama desde los listeners de #videoModalNativeVideo y
  // desde processPlayerState (más abajo), no solo al pulsar el botón.
  function setPlayPauseIcon(isPlaying) {
    videoModalPlayPause.textContent = isPlaying ? '⏸' : '▶';
    videoModalPlayPause.title = isPlaying ? 'Pausar' : 'Reproducir';
  }
  videoModalPlayPause.addEventListener('click', () => {
    if (currentHostedParams) {
      if (videoModalNativeVideo.paused) videoModalNativeVideo.play().catch(() => {});
      else videoModalNativeVideo.pause();
    } else if (ytPlayer && typeof ytPlayer.getPlayerState === 'function') {
      if (ytPlayer.getPlayerState() === YT.PlayerState.PLAYING) ytPlayer.pauseVideo();
      else ytPlayer.playVideo();
    }
  });

  // ── Corrección de una jugada (ver fix_003/fix_004 en el repo "videocuts")
  // No toca lo publicado desde VideoCuts: guarda la corrección aparte y se
  // superpone en memoria (ver applyCorrections) — si vuelven a publicar ese
  // partido, VideoCuts avisará de que hay correcciones que se perderían.
  const videoModalCorrect = document.getElementById('videoModalCorrect');
  const correctModalOverlay = document.getElementById('correctModalOverlay');
  const correctModalFields = document.getElementById('correctModalFields');
  const correctModalFeedback = document.getElementById('correctModalFeedback');
  const correctModalSave = document.getElementById('correctModalSave');
  const OTHER_OPTION = '__otro__';
  let correctModalRecord = null;
  let correctModalRole = null;
  // renderStats()/renderGkStats() recalculan TODO (KPIs, mapas de zona,
  // comparativa, clips, tabla) a partir de "records"/"gkRecords" y los
  // filtros activos — son funciones locales a cada pestaña (dentro de su
  // propio "if (records.length === 0) {...} else {...}"), así que no se
  // pueden llamar desde aquí directamente. Cada pestaña se apunta sola aquí
  // en cuanto se monta, para que guardar una corrección pueda refrescar la
  // que esté activa sin perder los filtros aplicados ni recargar la página.
  const tabRefreshers = { jugadores: null, portero: null };

  // Catálogo de opciones por partido (ver dataset_field_options) — se pide
  // una sola vez por partido y se reutiliza mientras dure la sesión en esta
  // página, no hace falta volver a pedirlo cada vez que se abre el modal.
  const fieldOptionsCache = new Map();
  async function getFieldOptionsFor(datasetId) {
    if (!datasetId) return {};
    if (fieldOptionsCache.has(datasetId)) return fieldOptionsCache.get(datasetId);
    let options = {};
    try {
      options = await fetchFieldOptions(datasetId);
    } catch {
      // sin catálogo no pasa nada: todos los campos caen a texto libre
    }
    fieldOptionsCache.set(datasetId, options);
    return options;
  }

  // Un campo del formulario: desplegable con las opciones conocidas (+
  // "Otros" con texto libre) si las hay, o directamente texto libre si no
  // hay catálogo para ese campo todavía (plantilla antigua, o publicado
  // antes de que VideoCuts mandara esto). El desplegable arranca ya en
  // "Otros" con el valor actual relleno si ese valor no está en la lista,
  // para no perder de vista lo que había.
  function buildFieldRow(field, currentValue, options) {
    const wrap = document.createElement('div');
    wrap.className = 'correct-field';
    wrap.dataset.field = field;
    const label = document.createElement('label');
    label.textContent = field;
    wrap.appendChild(label);

    if (Array.isArray(options) && options.length > 0) {
      const select = document.createElement('select');
      for (const opt of options) {
        const o = document.createElement('option');
        o.value = opt; o.textContent = opt;
        select.appendChild(o);
      }
      const otherOpt = document.createElement('option');
      otherOpt.value = OTHER_OPTION;
      otherOpt.textContent = 'Otros (especificar)…';
      select.appendChild(otherOpt);

      const textInput = document.createElement('input');
      textInput.type = 'text';
      textInput.placeholder = 'Nuevo valor';

      const matches = options.includes(currentValue);
      select.value = matches ? currentValue : OTHER_OPTION;
      textInput.hidden = matches;
      textInput.value = matches ? '' : (currentValue || '');

      select.addEventListener('change', () => {
        textInput.hidden = select.value !== OTHER_OPTION;
        if (select.value === OTHER_OPTION) textInput.focus();
      });

      wrap.appendChild(select);
      wrap.appendChild(textInput);
      wrap._getValue = () => (select.value === OTHER_OPTION ? textInput.value.trim() : select.value);
    } else {
      const textInput = document.createElement('input');
      textInput.type = 'text';
      textInput.value = currentValue || '';
      wrap.appendChild(textInput);
      wrap._getValue = () => textInput.value.trim();
    }

    wrap._originalValue = currentValue || '';
    return wrap;
  }

  async function openCorrectModal() {
    const record = currentVideoRows[currentVideoIndex];
    if (!record) return;
    correctModalRecord = record;
    correctModalRole = (record[COL_PUESTO] === 'Portero' || Boolean(record[COL_GK_POSITION])) ? 'portero' : 'jugadores';

    correctModalFeedback.textContent = '';
    correctModalFeedback.className = 'correct-modal-feedback';
    correctModalFields.innerHTML = '<div style="color:var(--text-muted);font-size:12px;">Cargando opciones…</div>';
    correctModalOverlay.hidden = false;

    const fieldOptions = await getFieldOptionsFor(record._datasetId);
    correctModalFields.innerHTML = '';

    // Un campo sin valor en ESTA jugada no se ofrece para corregir — sobre
    // todo pensado para campos que solo existen en algunas plantillas (p.ej.
    // "Con amago", propio de 7 metros): el viewer no sabe qué campos trae la
    // plantilla de cada tipo de evento, pero sí sabe si esta jugada en
    // concreto tiene algo que corregir ahí o no.
    const correctable = new Set(
      Object.keys(record).filter((f) => !f.startsWith('_') && !CORRECTION_EXCLUDED_FIELDS.has(f) && record[f])
    );

    for (const rowFields of CORRECTION_FIELD_LAYOUT) {
      const present = rowFields.filter((f) => correctable.has(f));
      if (present.length === 0) continue;
      const row = document.createElement('div');
      row.className = 'correct-field-row';
      for (const field of present) {
        row.appendChild(buildFieldRow(field, record[field], fieldOptions[field]));
        correctable.delete(field);
      }
      correctModalFields.appendChild(row);
    }
    // Cualquier campo con valor que no estuviera previsto en el orden de
    // arriba (plantilla nueva, p.ej.) se añade igual al final, uno por fila.
    for (const field of correctable) {
      const row = document.createElement('div');
      row.className = 'correct-field-row';
      row.appendChild(buildFieldRow(field, record[field], fieldOptions[field]));
      correctModalFields.appendChild(row);
    }

    if (correctModalFields.children.length === 0) {
      correctModalFields.innerHTML = '<div style="color:var(--text-muted);font-size:12px;">No hay ningún campo con valor que corregir en esta jugada.</div>';
    }
  }

  function closeCorrectModal() {
    correctModalOverlay.hidden = true;
  }

  videoModalCorrect.addEventListener('click', openCorrectModal);
  document.getElementById('correctModalClose').addEventListener('click', closeCorrectModal);
  document.getElementById('correctModalCancel').addEventListener('click', closeCorrectModal);
  correctModalOverlay.addEventListener('click', (e) => { if (e.target === correctModalOverlay) closeCorrectModal(); });

  correctModalSave.addEventListener('click', async () => {
    const record = correctModalRecord;
    if (!record) return;
    const changes = [];
    for (const wrap of correctModalFields.querySelectorAll('.correct-field')) {
      const field = wrap.dataset.field;
      const newValue = wrap._getValue();
      if (newValue && newValue !== wrap._originalValue) changes.push({ field, oldValue: wrap._originalValue, newValue });
    }
    if (changes.length === 0) {
      correctModalFeedback.textContent = 'No has cambiado nada.';
      correctModalFeedback.className = 'correct-modal-feedback';
      return;
    }
    correctModalSave.disabled = true;
    correctModalFeedback.textContent = 'Guardando…';
    correctModalFeedback.className = 'correct-modal-feedback';
    try {
      await saveCorrections(channelId, record[COL_EVENT_ID], correctModalRole, changes);
      const correctedFields = new Set(record._corrected || []);
      for (const c of changes) { record[c.field] = c.newValue; correctedFields.add(c.field); }
      record._corrected = correctedFields;
      renderVideoModalInfo(record); // refresca la info del modal de vídeo sin reiniciar el vídeo
      tabRefreshers[correctModalRole]?.(); // y los mapas/estadísticas/clips de la pestaña, con los filtros tal como estaban
      correctModalFeedback.textContent = 'Guardado.';
      setTimeout(closeCorrectModal, 700);
    } catch (err) {
      correctModalFeedback.textContent = err.message || 'No se pudo guardar.';
      correctModalFeedback.className = 'correct-modal-feedback is-error';
    } finally {
      correctModalSave.disabled = false;
    }
  });

  // Resultado → clase de la pill de color: perspectiva jugador (gol/parada/
  // fuera, tres colores, igual que en los Clips) o perspectiva portero
  // (good/bad — una parada es su éxito, un gol en contra su fallo). La
  // misma función sirve para las tarjetas de Clips (siempre jugador) y para
  // la información superpuesta del reproductor (compartida por las dos
  // pestañas, ver openVideoModal).
  function resultPillClass(resultado, isPortero) {
    if (isPortero) return /parada/i.test(resultado) ? 'good' : /gol/i.test(resultado) ? 'bad' : '';
    if (/gol/i.test(resultado)) return 'gol';
    if (/parada/i.test(resultado)) return 'parada';
    if (/fuera/i.test(resultado)) return 'fuera';
    return '';
  }

  // Botones-icono de estado on/off (antes checkboxes) — sin comportamiento
  // nativo de toggle, así que hay que gestionarlo a mano vía aria-pressed.
  function toggleIsOn(btn) { return btn.getAttribute('aria-pressed') === 'true'; }
  function setToggle(btn, on) { btn.setAttribute('aria-pressed', on ? 'true' : 'false'); }

  // En horizontal (pantalla baja) la info vive superpuesta al vídeo —
  // ahí hay sitio de sobra ahora que los toggles no gastan su propia fila.
  // En vertical, como bloque aparte debajo (superpuesta tapaba más jugada
  // de la que aportaba en pantallas estrechas). Un mismo nodo, movido de
  // sitio en el DOM según la orientación — cada caso reutiliza el CSS que
  // le toca (overlay absoluto dentro de .video-modal-frame, o flujo normal
  // dentro de .video-modal-body — ver ambas reglas de .video-modal-info).
  const landscapeModalQuery = window.matchMedia('(max-height: 500px)');
  function placeInfoBlock() {
    const target = landscapeModalQuery.matches ? videoModalFrame : videoModalBody;
    if (videoModalInfo.parentElement !== target) target.appendChild(videoModalInfo);
    updateGoalZoneOverlay(); // su posición (si toca) depende de si la info se superpone
  }
  landscapeModalQuery.addEventListener('change', placeInfoBlock);

  // Información del lanzamiento y zona de portería, cada una se puede
  // mostrar/ocultar por separado, con la preferencia recordada entre
  // visitas — desactivadas por defecto (a diferencia del auto-avance).
  try {
    setToggle(videoModalShowInfo, localStorage.getItem('vv_showInfoOverlay') === '1');
  } catch {}
  try {
    setToggle(videoModalShowGoalZone, localStorage.getItem('vv_showGoalZoneOverlay') === '1');
  } catch {}
  let currentGoalCode = null;
  function updateGoalZoneOverlay() {
    const show = toggleIsOn(videoModalShowGoalZone) && currentGoalCode;
    videoModalGoalZoneOverlay.hidden = !show;
    if (!show) return;
    videoModalGoalZoneOverlay.innerHTML = buildGoalZoneOverlaySVG(currentGoalCode);
    // Si la info se está superponiendo al vídeo (apaisado) y también está
    // visible, la miniatura sube por encima de su franja de texto en vez de
    // quedar tapada por ella.
    const infoOverlapping = videoModalInfo.parentElement === videoModalFrame && !videoModalInfo.hidden;
    videoModalGoalZoneOverlay.style.bottom = infoOverlapping
      ? `${Math.round(videoModalInfo.getBoundingClientRect().height) + 10}px`
      : '10px';
  }
  function updateInfoOverlay() {
    videoModalInfo.hidden = !toggleIsOn(videoModalShowInfo);
    updateGoalZoneOverlay(); // su posición (si toca) depende de si la info está visible
  }
  placeInfoBlock();
  videoModalAutoAdvance.addEventListener('click', () => {
    setToggle(videoModalAutoAdvance, !toggleIsOn(videoModalAutoAdvance));
  });
  videoModalShowInfo.addEventListener('click', () => {
    setToggle(videoModalShowInfo, !toggleIsOn(videoModalShowInfo));
    try { localStorage.setItem('vv_showInfoOverlay', toggleIsOn(videoModalShowInfo) ? '1' : '0'); } catch {}
    updateInfoOverlay();
  });
  videoModalShowGoalZone.addEventListener('click', () => {
    setToggle(videoModalShowGoalZone, !toggleIsOn(videoModalShowGoalZone));
    try { localStorage.setItem('vv_showGoalZoneOverlay', toggleIsOn(videoModalShowGoalZone) ? '1' : '0'); } catch {}
    updateGoalZoneOverlay();
  });

  function buildGoalZoneOverlaySVG(highlightCode) {
    const { cols, cellW, cellH, post, outSide, outTop } = GOAL_LAYOUT;
    const gridW = cols * cellW;
    const gridH = 3 * cellH;
    const gridX = outSide + post;
    const gridY = outTop + post;
    const width = gridW + post * 2 + outSide * 2;
    const height = gridH + post * 2 + outTop;

    function cell(code, x, y, w, h) {
      const isHit = code === highlightCode;
      const fill = isHit ? '#9085e9' : '#2a2a2a';
      const stroke = isHit ? '#fff' : '#444';
      return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}" stroke="${stroke}" stroke-width="${isHit ? 2 : 1}" />`;
    }

    const inner = GOAL_INNER_ZONES.map((code, i) => {
      const col = i % cols;
      const row = Math.floor(i / cols);
      return cell(code, gridX + col * cellW, gridY + row * cellH, cellW, cellH);
    }).join('');

    const outer = cell('out-top', gridX, 0, gridW, outTop) +
      cell('out-left', 0, gridY, outSide, gridH) +
      cell('out-right', gridX + gridW, gridY, outSide, gridH);

    return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Zona de portería de este lanzamiento">
      ${outer}
      <rect x="${gridX - post / 2}" y="${gridY - post / 2}" width="${gridW + post}" height="${gridH + post}" fill="none" stroke="#666" stroke-width="${post}" />
      ${inner}
    </svg>`;
  }

  // Navegación dentro del modal: la lista de "vídeos disponibles" es la
  // de la tabla de detalle de la pestaña activa, en el orden en que se
  // está viendo ahora mismo (respeta filtros y la columna por la que
  // esté ordenada). Cada pestaña reasigna currentVideoRows al renderizar
  // su tabla.
  let currentVideoRows = [];
  let currentVideoIndex = -1;
  let currentClipStart = 0;

  // Reproductor vía la API JS de YouTube (no un <iframe src=...> suelto):
  // hace falta para saber cuándo termina un corte (avanzar solo al
  // siguiente) y para poder "volver a ver" sin recargar el iframe. Si
  // el usuario pulsa "Ver" antes de que la API termine de cargar (script
  // externo, tarda un poco), se guarda en pendingVideo y se abre en
  // cuanto esté lista.
  //
  // La API puede no llegar nunca a cargar (bloqueadores de anuncios o
  // de privacidad — Brave Shields, uBlock, etc. — bloquean con
  // frecuencia justo este script de YouTube). Si no responde en unos
  // segundos, en vez de dejar el vídeo en negro para siempre, se cae a
  // un <iframe> normal (ver renderFallbackIframe/enterFallbackMode): se
  // pierde "volver a ver" sin recargar el iframe entero y, sobre todo,
  // cualquier forma fiable de saber si el vídeo está pausado o no — un
  // iframe suelto con enablejsapi en la URL no manda sus eventos de estado
  // sin el intercambio inicial que hace el envoltorio oficial de la API,
  // así que ahí "Pasar automáticamente al siguiente vídeo" se desactiva por
  // completo en vez de avanzar a ciegas sin importarle si está pausado.
  let ytPlayer = null;
  let ytApiReady = false;
  let fallbackMode = false;
  let pendingVideo = null;
  let currentVideoParams = null;

  // Vídeo propio en R2 (alternativa a YouTube) — no-null es la señal de
  // "el corte activo va por aquí, no por YouTube", ver más abajo
  // (loadHostedClip, y su uso en openVideoModal/replayVideo/closeVideoModal).
  let currentHostedParams = null;

  window.onYouTubeIframeAPIReady = function () {
    ytApiReady = true;
    if (fallbackMode) return; // ya se optó por el iframe simple, no cambiar a mitad de sesión
    if (pendingVideo) {
      loadIntoPlayer(pendingVideo);
      pendingVideo = null;
    }
  };

  // Entrar en modo de reserva deshabilita, con su propia explicación, todo
  // lo que dependía de saber el estado real del vídeo: "Volver a ver" (ya
  // lo hacía) y "Pasar automáticamente al siguiente vídeo al terminar" —
  // probado con la API bloqueada de verdad (ver commit anterior): un
  // iframe suelto con enablejsapi en la URL NO llega a mandar sus eventos
  // de estado sin el intercambio inicial que hace el envoltorio oficial de
  // la API, así que aquí no hay ninguna señal fiable de si el vídeo está
  // pausado o no — mejor no avanzar nunca a ciegas (le daría igual que
  // estuviera pausado) que avanzar en el momento equivocado.
  function enterFallbackMode() {
    if (fallbackMode) return;
    fallbackMode = true;
    const reason = 'No disponible: no se pudo cargar la API de YouTube (¿bloqueador de anuncios?)';
    videoModalReplay.title = reason;
    setToggle(videoModalAutoAdvance, false);
    videoModalAutoAdvance.disabled = true;
    videoModalAutoAdvance.title = reason;
    // El iframe suelto de reserva tampoco tiene pauseVideo/playVideo.
    videoModalPlayPause.disabled = true;
    videoModalPlayPause.title = reason;
  }

  // 3000ms era demasiado poco: en condiciones reales (compitiendo con el
  // resto de recursos de la página nada más cargar) el script de la API
  // podía tardar más que eso sin estar bloqueado por nada — y una vez se
  // entra en modo de reserva, se queda así el resto de la sesión aunque el
  // script termine cargando justo después (ver onYouTubeIframeAPIReady más
  // arriba). Preferible esperar un poco más antes de rendirse.
  setTimeout(() => {
    if (ytApiReady) return;
    enterFallbackMode();
    if (pendingVideo) {
      renderFallbackIframe(pendingVideo);
      pendingVideo = null;
    }
  }, 8000);

  function renderFallbackIframe({ youtubeId, startSec, endSec }) {
    // controls=0 se probó y se quitó: en Brave (Shields) y bloqueadores
    // similares el envoltorio JS de YouTube puede quedarse atascado
    // reintentando una llamada de telemetría bloqueada, y entonces ni la API
    // ni el postMessage directo conseguían pausar/reanudar — sin controles
    // nativos, eso dejaba el vídeo sin ninguna forma de pausarlo. Mejor
    // conservar el botón de pausa y la barra de progreso propios de YouTube,
    // aunque añadan algo de chrome sobre cortes tan breves. iv_load_policy/
    // modestbranding se mantienen: limpian tarjetas/logo sin afectar a la
    // pausa.
    const params = new URLSearchParams({
      start: String(startSec), autoplay: '1', rel: '0',
      modestbranding: '1', iv_load_policy: '3', r: String(Date.now())
    });
    if (Number.isFinite(endSec) && endSec > startSec) params.set('end', String(endSec));
    document.getElementById('videoModalPlayer').innerHTML =
      `<iframe src="https://www.youtube.com/embed/${youtubeId}?${params.toString()}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
  }

  // Avanza solo al siguiente vídeo cuando toca — nunca dos veces para
  // el mismo corte, y nunca si el modal ya se cerró o si el usuario ha
  // desmarcado la casilla.
  let advanceFired = false;

  function tryAutoAdvance() {
    if (advanceFired || videoModalOverlay.hidden || !toggleIsOn(videoModalAutoAdvance)) return;
    advanceFired = true;
    goToVideo(1);
  }

  function loadIntoPlayer({ youtubeId, startSec, endSec }) {
    // controls:0 se probó y se quitó (ver renderFallbackIframe): rompía la
    // pausa en Brave/bloqueadores similares sin ganancia real a cambio.
    const vars = { start: startSec, autoplay: 1, rel: 0, modestbranding: 1, iv_load_policy: 3 };
    if (Number.isFinite(endSec) && endSec > startSec) vars.end = endSec;
    try {
      if (!ytPlayer) {
        ytPlayer = new YT.Player('videoModalPlayer', {
          videoId: youtubeId,
          playerVars: vars,
          events: {
            onStateChange: handlePlayerStateChange,
            onError: () => {
              enterFallbackMode();
              renderFallbackIframe({ youtubeId, startSec, endSec });
            }
          }
        });
      } else {
        ytPlayer.loadVideoById({ videoId: youtubeId, startSeconds: startSec, endSeconds: vars.end });
      }
    } catch {
      enterFallbackMode();
      renderFallbackIframe({ youtubeId, startSec, endSec });
    }
  }

  // El parámetro "end" hace que YouTube PAUSE el vídeo al llegar ahí,
  // no que llegue a "terminado" (ENDED) — y ese mismo estado PAUSADO
  // es el que dispara si el usuario pausa el vídeo él mismo a mitad,
  // para poder revisar la jugada con calma. Para no confundir un pause
  // manual con "se acabó el corte", se mira el tiempo real reproducido
  // (getCurrentTime): solo si ya está en el fin del corte se considera
  // acabado de verdad; si el usuario lo retoma, sigue donde estaba.
  //
  // Bug real encontrado al probarlo: al cargar un corte nuevo con
  // loadVideoById (reutiliza el mismo ytPlayer), YouTube puede disparar un
  // PAUSED transitorio mientras carga/hace buffering — y en ese momento
  // getCurrentTime() todavía puede devolver el tiempo del corte ANTERIOR
  // (no se ha actualizado todavía al nuevo). Si ese tiempo residual ya
  // superaba el "fin de corte" del nuevo vídeo, se disparaba un avance
  // automático inmediato, antes de que el corte nuevo llegara a
  // reproducirse — exactamente cuando el vídeo tarda un poco en cargar.
  // clipHasStarted (a false al empezar cada corte, ver openVideoModal/
  // replayVideo) exige haber visto de verdad un PLAYING de ESTE corte antes
  // de fiarnos de un PAUSED para decidir que se acabó.
  let clipHasStarted = false;

  // ─── Vídeo propio en R2 ─────────────────────────────────────────────────
  // Alternativa a todo lo de arriba: un <video> normal, sin API externa, sin
  // bloqueadores que puedan cortarla, sin modo de reserva — el navegador ya
  // sabe hacer byte-range de sobra. Reutiliza las mismas advanceFired/
  // clipHasStarted/tryAutoAdvance que YouTube: un solo criterio de "cuándo
  // se considera acabado un corte", sea cual sea el reproductor que lo esté
  // sirviendo.
  function loadHostedClip({ url, startSec, endSec }) {
    currentHostedParams = { url, startSec, endSec };
    const startPlayback = () => {
      videoModalNativeVideo.currentTime = startSec;
      videoModalNativeVideo.play().catch(() => {}); // autoplay puede fallar sin gesto previo; no es un error real
    };
    if (videoModalNativeVideo.src === url) {
      startPlayback();
    } else {
      videoModalNativeVideo.src = url;
      videoModalNativeVideo.addEventListener('loadedmetadata', startPlayback, { once: true });
    }
  }

  videoModalNativeVideo.addEventListener('playing', () => { clipHasStarted = true; });
  videoModalNativeVideo.addEventListener('play', () => setPlayPauseIcon(true));
  videoModalNativeVideo.addEventListener('pause', () => setPlayPauseIcon(false));
  // Clic en el propio vídeo para pausar/reanudar — YouTube ya lo trae de
  // serie en su reproductor, aquí hay que ponerlo a mano.
  videoModalNativeVideo.addEventListener('click', () => {
    if (videoModalNativeVideo.paused) videoModalNativeVideo.play().catch(() => {});
    else videoModalNativeVideo.pause();
  });
  videoModalNativeVideo.addEventListener('timeupdate', () => {
    if (!currentHostedParams || !Number.isFinite(currentHostedParams.endSec)) return;
    if (videoModalNativeVideo.currentTime >= currentHostedParams.endSec - 0.05) {
      videoModalNativeVideo.pause();
      tryAutoAdvance();
    }
  });
  videoModalNativeVideo.addEventListener('pause', () => {
    // Mientras está pausado no llegan más "timeupdate" (currentTime no
    // avanza), así que el tiempo pausado nunca cuenta para el auto-avance —
    // ni hace falta guardia aparte para eso, es como se comporta ya un
    // <video> normal.
    if (!currentHostedParams || !clipHasStarted) return;
    const nearEnd = videoModalNativeVideo.currentTime >= currentHostedParams.endSec - 0.5;
    // Igual que con YouTube: una pausa manual de verdad (no ha llegado al
    // final del corte) desactiva el auto-avance en vez de dejarlo marcado
    // en silencio para cuando el usuario reanude.
    if (!nearEnd && toggleIsOn(videoModalAutoAdvance)) setToggle(videoModalAutoAdvance, false);
  });

  // stateCode: mismos códigos numéricos que YT.PlayerState (1 jugando, 0
  // acabado, 2 pausado...). currentTimeHint: si ya se conoce el tiempo
  // reproducido (viene en el mensaje bruto de infoDelivery, ver más abajo),
  // se usa directamente en vez de volver a preguntarle a ytPlayer.
  function processPlayerState(stateCode, currentTimeHint) {
    if (typeof YT === 'undefined') return; // por si el mensaje bruto llegara antes de que cargue el script de la API
    if (stateCode === YT.PlayerState.PLAYING) { clipHasStarted = true; setPlayPauseIcon(true); return; }
    if (stateCode === YT.PlayerState.PAUSED) setPlayPauseIcon(false);
    // Bug real encontrado al probarlo: loadVideoById reutiliza el mismo
    // reproductor/iframe para el siguiente corte, y un evento ENDED que en
    // realidad pertenecía al corte YA ABANDONADO puede llegar tarde, justo
    // después de haber empezado a cargar el nuevo — antes de que este haya
    // tenido ocasión de reproducirse. Sin la misma guarda que ya usa PAUSED
    // (exigir un PLAYING real de ESTE corte primero), ese ENDED atrasado
    // disparaba un avance inmediato — y si el siguiente corte recibía a su
    // vez otro ENDED atrasado de la misma manera, la cadena de avances
    // podía llegar a saltar hasta el último corte de la lista casi de
    // golpe, dejando la reproducción parada ahí.
    if (stateCode === YT.PlayerState.ENDED) { if (clipHasStarted) tryAutoAdvance(); return; }
    if (stateCode === YT.PlayerState.PAUSED && clipHasStarted && currentVideoParams && Number.isFinite(currentVideoParams.endSec)) {
      const currentTime = Number.isFinite(currentTimeHint) ? currentTimeHint : (ytPlayer ? ytPlayer.getCurrentTime() : NaN);
      if (!Number.isFinite(currentTime)) return;
      if (currentTime >= currentVideoParams.endSec - 0.5) {
        tryAutoAdvance();
      } else if (toggleIsOn(videoModalAutoAdvance)) {
        // Pausa manual de verdad (no ha llegado al final del corte todavía):
        // el usuario se ha parado a mirar la jugada con calma, no quiere
        // que salte solo al siguiente corte en cuanto reanude sin avisar.
        // Se desactiva el botón en vez de dejarlo marcado en silencio.
        setToggle(videoModalAutoAdvance, false);
      }
    }
  }

  function handlePlayerStateChange(e) { processPlayerState(e.data); }

  // Vía de detección adicional, en paralelo al callback de arriba: en
  // navegadores con bloqueadores de rastreo (Brave Shields y similares) que
  // cortan las llamadas de telemetría de YouTube, el envoltorio oficial de
  // la API puede quedarse atascado reintentando esa llamada bloqueada y no
  // llegar a invocar nunca nuestro onStateChange — aunque el iframe siga
  // mandando sus propios mensajes por postMessage con normalidad. Escuchar
  // esos mensajes en bruto, nosotros mismos, no depende de que el
  // envoltorio oficial no se haya colgado. Esto SOLO aplica al reproductor
  // de la API (enablejsapi ya viene activado ahí) — el iframe de reserva de
  // más abajo no lo lleva y, comprobado, no manda estos mensajes sin el
  // intercambio inicial que hace el envoltorio oficial (ver
  // enterFallbackMode). Si además funciona la vía oficial (caso normal, sin
  // nada bloqueado), esto simplemente repite el mismo resultado sin
  // problema: tryAutoAdvance ya se protege con advanceFired.
  window.addEventListener('message', (event) => {
    if (event.origin !== 'https://www.youtube.com') return;
    let data;
    try { data = JSON.parse(event.data); } catch { return; }
    if (!data || !data.event) return;
    if (data.event === 'infoDelivery' && data.info && typeof data.info.playerState === 'number') {
      processPlayerState(data.info.playerState, data.info.currentTime);
    } else if (data.event === 'onStateChange' && typeof data.info === 'number') {
      processPlayerState(data.info);
    }
  });

  function replayVideo() {
    advanceFired = false;
    clipHasStarted = false; // igual que al cargar un corte nuevo: no fiarse de un PAUSED hasta ver un PLAYING real tras el seek
    if (currentHostedParams) {
      videoModalNativeVideo.currentTime = currentHostedParams.startSec;
      videoModalNativeVideo.play().catch(() => {});
    } else if (fallbackMode) {
      renderFallbackIframe(currentVideoParams);
    } else if (ytPlayer) {
      ytPlayer.seekTo(currentClipStart, true);
      ytPlayer.playVideo();
    }
  }

  function goToVideo(delta) {
    const next = currentVideoIndex + delta;
    if (next < 0 || next >= currentVideoRows.length) return;
    openVideoModal(currentVideoRows[next], next);
  }

  function closeVideoModal() {
    videoModalOverlay.hidden = true;
    videoModalNativeVideo.pause();
    if (ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo(); // corta la reproducción al cerrar
    else if (fallbackMode) document.getElementById('videoModalPlayer').innerHTML = ''; // sin API no hay pauseVideo: se quita el iframe
  }

  // Dos líneas en forma de frase, sin nombres de campo: la primera sitúa la
  // jugada (partido/parte/tiempo/puesto/fase de juego), la segunda cuenta
  // qué pasó (jugador — mano, tipo — resultado, con color). "Fase de
  // juego" no existe en los CSV de portero — se cae sola del
  // filter(Boolean), igual que "Puesto" cuando falta. Separada de
  // openVideoModal para poder volver a pintarla sin reiniciar el vídeo
  // justo después de guardar una corrección (ver correctModalSave).
  function renderVideoModalInfo(record) {
    const resultado = record['Resultado'] || '';
    // No todos los CSV de portero llevan la columna "Puesto" (depende de
    // qué columnas fijas se marcaran al configurar la exportación en
    // VideoCuts) — "Posición portero" sí es propia de cualquier exportación
    // de portero, así que es la señal fiable de que este registro es suyo.
    const isPortero = record[COL_PUESTO] === 'Portero' || Boolean(record[COL_GK_POSITION]);
    const pillClass = resultPillClass(resultado, isPortero);
    const playerLabel = record[COL_PLAYER] ? parsePlayer(record[COL_PLAYER]).label : '';

    const correctedBadge = record._corrected && record._corrected.size > 0
      ? ' <span class="corrected-badge" title="Datos corregidos desde el viewer">corregido</span>' : '';

    const line1 = [record[COL_CODE], record['Parte'], record['Tiempo de partido'], record[COL_PUESTO], record['Fase de juego']]
      .filter(Boolean).map(escapeHtml).join(' · ') + correctedBadge;

    const manoTipo = [record['Mano'], record['Tipo de lanzamiento']].filter(Boolean).join(', ');
    const line2 = [playerLabel, manoTipo].filter(Boolean).map(escapeHtml).join(' — ') +
      (resultado ? ` <span class="result-pill ${pillClass}">${escapeHtml(resultado)}</span>` : '');

    videoModalInfo.innerHTML = `
      <div class="video-modal-info-line video-modal-info-context">${line1}</div>
      <div class="video-modal-info-line">${line2}</div>`;
  }

  // El resultado ("Gol"/"Parada"/"Fuera") se colorea distinto según la
  // pestaña: para jugadores un gol es un éxito (verde) y una parada un
  // fallo (azul, neutro); para portero es justo al revés (una parada es
  // el éxito del portero). Se distingue mirando el Puesto del registro:
  // solo los cortes de portero llevan literalmente "Portero" ahí.
  function openVideoModal(record, index) {
    currentVideoIndex = index ?? currentVideoRows.indexOf(record);
    videoModalPrev.disabled = currentVideoIndex <= 0;
    videoModalNext.disabled = currentVideoIndex < 0 || currentVideoIndex >= currentVideoRows.length - 1;

    const youtubeId = record[COL_YOUTUBE];
    const startSec = Math.max(0, Math.floor(Number(record[COL_CLIP_START]) || 0));
    const endSec = Math.floor(Number(record[COL_CLIP_END]));
    currentClipStart = startSec;
    currentVideoParams = { youtubeId, startSec, endSec };
    advanceFired = false;
    clipHasStarted = false;

    // Vídeo propio en R2 si el corte lo tiene (subido desde VideoCuts, ver
    // hostedVideoService.ts) — YouTube si no, exactamente como siempre.
    const hostedUrl = record[COL_HOSTED_URL];
    const hostedStart = Number(record[COL_HOSTED_START]);
    const hostedEnd = Number(record[COL_HOSTED_END]);
    const isHosted = !!hostedUrl && Number.isFinite(hostedStart) && Number.isFinite(hostedEnd);

    if (isHosted) {
      currentHostedParams = null; // se rellena de verdad dentro de loadHostedClip
      videoModalYtWrap.hidden = true;
      videoModalNativeVideo.hidden = false;
      // No dejar sonando de fondo el corte anterior si venía de YouTube —
      // por API (caso normal) o, si esta sesión entró en modo de reserva
      // (bloqueador de anuncios), quitando directamente el iframe suelto,
      // que no tiene pauseVideo().
      if (ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo();
      else if (fallbackMode) document.getElementById('videoModalPlayer').innerHTML = '';
      // El vídeo propio tiene control de pausa y de auto-avance fiable
      // siempre, sea cual sea el estado de fallbackMode (que solo afecta a
      // YouTube) — si una sesión anterior los dejó deshabilitados al
      // toparse con un corte de YouTube sin API disponible, se reactivan
      // aquí. Sin esto, activar "auto-avance" no hacía nada en un corte con
      // vídeo propio si antes se había visto uno de YouTube en modo de
      // reserva — mismo fallo que ya se corrigió para el botón de pausa,
      // se me olvidó aplicarlo también aquí.
      videoModalPlayPause.disabled = false;
      videoModalPlayPause.title = 'Pausar';
      videoModalAutoAdvance.disabled = false;
      videoModalAutoAdvance.title = 'Pasar automáticamente al siguiente vídeo al terminar';
      // Con vídeo propio ya no hay motivo para que venga desactivado — es
      // fiable en cualquier navegador, así que cada corte con vídeo propio
      // arranca con el auto-avance activo por defecto (aunque se hubiera
      // desactivado antes, a mano o por un corte de YouTube previo).
      setToggle(videoModalAutoAdvance, true);
      loadHostedClip({ url: hostedUrl, startSec: hostedStart, endSec: hostedEnd });
    } else {
      currentHostedParams = null;
      videoModalNativeVideo.hidden = true;
      videoModalNativeVideo.pause();
      videoModalYtWrap.hidden = false;
      if (fallbackMode) {
        renderFallbackIframe(currentVideoParams);
        videoModalPlayPause.disabled = true;
        videoModalPlayPause.title = videoModalReplay.title;
      } else {
        videoModalPlayPause.disabled = false;
        videoModalPlayPause.title = 'Pausar';
        if (ytApiReady) loadIntoPlayer(currentVideoParams);
        else pendingVideo = currentVideoParams;
      }
    }
    setPlayPauseIcon(true); // los dos reproductores arrancan en autoplay

    renderVideoModalInfo(record);
    currentGoalCode = GOAL_LABEL_TO_CODE[record[COL_GOAL]] || null;

    videoModalOverlay.hidden = false;
    updateInfoOverlay(); // pinta/oculta la info y recoloca la zona de portería si toca
  }

  const params = new URLSearchParams(location.search)
  const channelId = params.get('id')
  const team = params.get('equipo')
  const teamNameEl = document.getElementById('teamName')
  const panels = {
    jugadores: document.getElementById('tab-jugadores'),
    portero: document.getElementById('tab-portero')
  }

  document.querySelectorAll('.tab-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      for (const key of Object.keys(panels)) panels[key].hidden = key !== btn.dataset.tab;
    });
  });

  if (!channelId || !team) {
    teamNameEl.textContent = 'Falta el equipo';
    panels.jugadores.innerHTML = '<div class="empty-state">Esta página necesita ?id=...&equipo=... en la URL. Entra desde "Mis equipos".</div>';
  } else if (await requireSession()) {
    teamNameEl.textContent = team;
    document.title = `${team} — VideoCuts`;
    try {
      const channelName = await getChannelName(channelId);
      if (channelName) teamNameEl.textContent = `${team} · ${channelName}`;

      const records = await fetchTeamRecords(channelId, team, 'jugadores');
      await applyCorrections(records, channelId, 'jugadores');
      if (records.length === 0) {
        panels.jugadores.innerHTML = '<div class="empty-state">Sin datos de jugadores para este equipo todavía.</div>';
      } else {

        // Puesto solo existe en CSVs exportados con la versión de VideoCuts
        // que lo incluye — si el rival no lo tiene relleno, ni el gráfico ni
        // la agrupación del filtro de Jugador se muestran, en vez de salir
        // vacíos o "sin definir" en todos los jugadores.
        const hasPuesto = records.some((r) => r[COL_PUESTO]);

        panels.jugadores.innerHTML = `
          <div class="jug-wrap">
            ${hasPuesto ? `
            <section aria-label="Selección de puesto">
              <div class="dash-filters-title" style="margin-bottom:8px;">Puesto del lanzador</div>
              <div class="position-select" id="positionSelect"></div>
            </section>` : ''}

            <div class="panel" id="filtersPanel" data-collapsible>
              <div class="panel-title-row">
                <div class="panel-title">Filtros</div>
                <div style="display:flex; align-items:center; gap:14px;">
                  <button type="button" class="filters-reset" id="filtersReset">Limpiar todo</button>
                  <button type="button" class="panel-collapse-btn" aria-label="Colapsar sección">▾</button>
                </div>
              </div>
              <div class="panel-body">
                <div class="filters-tier">
                  <div class="chip-group">
                    <span class="group-label">Jornada</span>
                    <div id="jornadaChips"></div>
                  </div>
                  <div class="chip-group">
                    <span class="group-label">Resultado</span>
                    <div id="resultadoChips"></div>
                  </div>
                  <div class="chip-group" id="modalidadGroup" hidden>
                    <span class="group-label">Modalidad</span>
                    <div id="modalidadChips"></div>
                  </div>
                </div>
                <div class="filters-divider"></div>
                <div class="dash-filters-title" style="margin-bottom:8px;">Detalle del lanzamiento</div>
                <div class="filters-row" id="filtersCol"></div>
              </div>
            </div>

            <div class="jug-layout">
              <div class="jug-col-a">
                <div class="panel" data-collapsible>
                  <div class="panel-title-row">
                    <div class="panel-title" id="statHeadlineTitle">Resumen</div>
                    <button type="button" class="panel-collapse-btn" aria-label="Colapsar sección">▾</button>
                  </div>
                  <div class="panel-body">
                    <div class="stat-tiles" id="statHeadline"></div>
                  </div>
                </div>
                <div class="panel" id="playerComparisonPanel" data-collapsible hidden>
                  <div class="panel-title-row">
                    <div class="panel-title">Comparativa de jugadores</div>
                    <button type="button" class="panel-collapse-btn" aria-label="Colapsar sección">▾</button>
                  </div>
                  <div class="panel-body">
                    <div class="chart-legend">
                      <span class="chart-legend-item"><span class="chart-legend-swatch" style="background:var(--accent)"></span>Lanzamientos</span>
                      <span class="chart-legend-item"><span class="chart-legend-swatch" style="background:#d95926"></span>Goles</span>
                    </div>
                    <div id="playerComparisonChart"></div>
                  </div>
                </div>
                <div class="panel" id="zoneLanzamientoPanel" data-collapsible>
                  <div class="panel-title-row">
                    <div class="panel-title">Zona de lanzamiento</div>
                    <div style="display:flex; align-items:center; gap:10px;">
                      <button type="button" class="zone-clear-btn" id="zonePositionClear" disabled>Borrar selección</button>
                      <button type="button" class="panel-collapse-btn" aria-label="Colapsar sección">▾</button>
                    </div>
                  </div>
                  <div class="panel-body">
                    <div id="zonePositionChart"></div>
                  </div>
                </div>
                <div class="panel" data-collapsible>
                  <div class="panel-title-row">
                    <div class="panel-title">Zona de portería</div>
                    <div style="display:flex; align-items:center; gap:10px;">
                      <button type="button" class="zone-clear-btn" id="goalZoneClear" disabled>Borrar selección</button>
                      <button type="button" class="panel-collapse-btn" aria-label="Colapsar sección">▾</button>
                    </div>
                  </div>
                  <div class="panel-body">
                    <div id="goalZoneChart"></div>
                  </div>
                </div>
              </div>
              <aside class="jug-col-b">
                <div class="panel" id="clipsPanel" data-collapsible hidden>
                  <div class="panel-title-row">
                    <div class="panel-title" id="clipsTitle">Clips</div>
                    <div style="display:flex; align-items:center; gap:10px;">
                      <span class="clips-count" id="clipsCount"></span>
                      <button type="button" class="panel-collapse-btn" aria-label="Colapsar sección">▾</button>
                    </div>
                  </div>
                  <div class="panel-body">
                    <div class="filmstrip" id="filmstrip"></div>
                  </div>
                </div>
              </aside>
            </div>

            <div class="panel" id="detailTablePanel" hidden>
              <button type="button" class="table-toggle" id="tableToggle">Ver tabla completa ▾</button>
              <div class="table-wrap" id="tableWrap" hidden>
                <div class="detail-table-wrap">
                  <table class="detail-table" id="detailTable"></table>
                </div>
              </div>
            </div>
          </div>`;

        // Secciones colapsables (sobre todo útil en móvil, para no obligar a
        // hacer tanto scroll por una sección que no interesa ahora mismo) —
        // el panel de Filtros es una más, ya no necesita su propio mecanismo
        // de mostrar/ocultar aparte (setupFiltersToggle, que sigue usando la
        // pestaña Portero con su barra lateral).
        document.querySelectorAll('#tab-jugadores .panel[data-collapsible]').forEach((panel) => {
          const btn = panel.querySelector('.panel-collapse-btn');
          btn.addEventListener('click', () => panel.toggleAttribute('data-collapsed'));
        });

        const filtersCol = document.getElementById('filtersCol');
        // Cada filtro registra cómo sacar "su" valor de un registro
        // (getValue) y qué tiene seleccionado ahora mismo — así el filtro de
        // tiempo (un valor calculado, no una columna directa) encaja igual
        // que los que sí son una columna tal cual.
        const activeFilters = {} // key -> { getValue, selected }
        // Componentes de filtro con desplegable propio (los que se activan
        // solo desde un gráfico, como zona de lanzamiento, no tienen entrada
        // aquí) — para poder sincronizarlos al pulsar "Limpiar todo".
        const filterComponents = {} // key -> { setSelected }

        // Filtros "inmediatos" en forma de chips (Jornada/Resultado/
        // Modalidad): mismo criterio de selección que el resto
        // (selected=[] es "todos", el array acumula valores marcados) pero
        // sin desplegable — se ven y se pulsan de un vistazo. El resto de
        // filtros (más variados) se quedan como desplegable.
        function toggleArrayFilter(key, value) {
          const cur = activeFilters[key].selected;
          activeFilters[key].selected = cur.includes(value) ? cur.filter((v) => v !== value) : [...cur, value];
          renderStats();
        }

        function createChipGroup(containerId, key, options) {
          const el = document.getElementById(containerId);
          function render() {
            const selected = activeFilters[key].selected;
            el.innerHTML = options.map((o) => `
              <button type="button" class="chip ${selected.includes(o.value) ? 'active' : ''}" data-value="${escapeHtml(o.value)}">${o.dot ? `<span class="chip-dot" style="background:${o.dot}"></span>` : ''}${escapeHtml(o.label)}</button>`).join('');
            el.querySelectorAll('.chip').forEach((btn) => {
              btn.addEventListener('click', () => { toggleArrayFilter(key, btn.dataset.value); render(); });
            });
          }
          render();
          return { setSelected: render };
        }

        // Con pocas jornadas, chips (un vistazo); con muchas (liga completa),
        // desplegable — si no, la fila de chips crece sin control.
        const jornadaValues = [...new Set(records.map((r) => r[COL_CODE]).filter(Boolean))].sort();
        activeFilters.partido = { getValue: (r) => r[COL_CODE], selected: [] };
        if (jornadaValues.length > 3) {
          const jornadaFilter = createDropdownFilter({
            fieldLabel: 'Jornada',
            options: jornadaValues.map((v) => ({ value: v, label: v })),
            onChange: (selected) => { activeFilters.partido.selected = selected; renderStats(); }
          });
          document.getElementById('jornadaChips').appendChild(jornadaFilter.el);
          filterComponents.partido = jornadaFilter;
        } else {
          filterComponents.partido = createChipGroup('jornadaChips', 'partido', jornadaValues.map((v) => ({ value: v, label: v })));
        }

        activeFilters.resultado = { getValue: (r) => r['Resultado'], selected: [] };
        filterComponents.resultado = createChipGroup('resultadoChips', 'resultado', [
          { value: 'Gol', label: 'Gol', dot: '#0ca30c' },
          { value: 'Parada', label: 'Parada', dot: '#3987e5' },
          { value: 'Fuera', label: 'Fuera / palo', dot: '#d95926' }
        ]);

        const timeFilter = createTreeDropdownFilter({
          fieldLabel: 'Tiempo de juego',
          groups: buildTimeTree(),
          onChange: (selected) => { activeFilters.tiempo.selected = selected; renderStats(); }
        });
        activeFilters.tiempo = { getValue: (r) => computeTimeBucketKey(r), selected: [] };
        filterComponents.tiempo = timeFilter;
        filtersCol.appendChild(timeFilter.el);

        // Jugador: si hay "Puesto" relleno, agrupado en árbol (puesto >
        // jugadores, igual que Tiempo de juego); si no, el desplegable plano
        // de siempre. Los jugadores sin puesto van a un grupo aparte, para
        // que no desaparezcan del filtro. "Filtrar los filtros": las
        // opciones se recalculan en cada renderStats() a partir de quién
        // queda tras el resto de filtros activos (puesto elegido, modalidad
        // 7 metros...) — ver refreshJugadorFilter, llamado desde renderStats.
        function playersToOptions(rawValues) {
          return [...rawValues]
            .map((raw) => ({ value: raw, ...parsePlayer(raw) }))
            .sort((a, b) => a.dorsal - b.dorsal)
            .map(({ value, label }) => ({ value, label }));
        }

        function computeJugadorGroups(scopedRecords) {
          const byPosition = new Map();
          const sinPuesto = new Set();
          for (const r of scopedRecords) {
            const raw = r[COL_PLAYER];
            if (!raw) continue;
            const code = POSITION_LABEL_TO_CODE[r[COL_PUESTO]];
            if (code) {
              if (!byPosition.has(code)) byPosition.set(code, new Set());
              byPosition.get(code).add(raw);
            } else {
              sinPuesto.add(raw);
            }
          }
          const groups = POSITION_ORDER
            .filter((code) => byPosition.has(code))
            .map((code) => ({
              value: code,
              label: `${code} · ${POSITION_LABELS[code]}`,
              children: playersToOptions(byPosition.get(code))
            }));
          if (sinPuesto.size > 0) {
            groups.push({ value: '__sin_puesto__', label: 'Sin puesto definido', children: playersToOptions(sinPuesto) });
          }
          return groups;
        }

        let playerFilter;
        if (hasPuesto) {
          playerFilter = createTreeDropdownFilter({
            fieldLabel: 'Jugador',
            groups: computeJugadorGroups(records),
            onChange: (selected) => { activeFilters.jugador.selected = selected; renderStats(); }
          });
        } else {
          const playerOptions = playersToOptions(new Set(records.map((r) => r[COL_PLAYER]).filter(Boolean)));
          playerFilter = createDropdownFilter({
            fieldLabel: 'Jugador',
            options: playerOptions,
            onChange: (selected) => { activeFilters.jugador.selected = selected; renderStats(); }
          });
        }
        activeFilters.jugador = { getValue: (r) => r[COL_PLAYER], selected: [] };
        filterComponents.jugador = playerFilter;
        filtersCol.appendChild(playerFilter.el);

        function refreshJugadorFilter() {
          const scoped = filteredExcept('jugador');
          const distinctPlayers = new Set(scoped.map((r) => r[COL_PLAYER]).filter(Boolean));
          if (hasPuesto) playerFilter.setGroups(computeJugadorGroups(scoped));
          else playerFilter.setOptions(playersToOptions(distinctPlayers));
          playerFilter.el.hidden = distinctPlayers.size <= 1;
        }

        // Fase de juego: sin buscador, y ordenado por nº de eventos (el más
