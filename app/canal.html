        // frecuente primero), no alfabético. Solo tiene sentido en juego —
        // en un 7 metros no varía, se oculta en ese modo (ver
        // refreshFaseFilter). Opciones recalculadas en cada renderStats a
        // partir de lo que queda tras el resto de filtros ("filtrar los
        // filtros"): si tras elegir puesto/jugador solo queda una fase
        // posible, el filtro entero desaparece — no serviría de nada.
        const COL_PHASE = 'Fase de juego';
        function computePhaseOptions(scopedRecords) {
          const counts = new Map();
          for (const r of scopedRecords) {
            const v = r[COL_PHASE];
            if (v) counts.set(v, (counts.get(v) || 0) + 1);
          }
          return [...counts.entries()].sort((a, b) => b[1] - a[1]).map(([value]) => ({ value, label: value }));
        }
        let phaseFilter = null;
        if (computePhaseOptions(records).length > 0) {
          phaseFilter = createDropdownFilter({
            fieldLabel: 'Fase de juego',
            options: computePhaseOptions(records),
            showSearch: false,
            onChange: (selected) => { activeFilters.fase.selected = selected; renderStats(); }
          });
          activeFilters.fase = { getValue: (r) => r[COL_PHASE], selected: [] };
          filterComponents.fase = phaseFilter;
          filtersCol.appendChild(phaseFilter.el);
        }

        // Modalidad: en juego vs 7 metros, no es un filtro más — es
        // excluyente (siempre hay exactamente uno activo, nunca "los dos" ni
        // "ninguno") porque cambia qué más tiene sentido mostrar: en juego
        // aplica la Fase de juego y la Zona de lanzamiento; en un 7 metros
        // la zona no varía (tontería mostrarla) y en cambio sí importa si
        // hubo amago. El puesto del lanzador tampoco tiene sentido en un 7
        // metros — se deshabilita entero en vez de recalcularse (ver
        // renderPositionSelect), al contrario que el resto de filtros.
        const COL_EVENT_TYPE = 'Tipo de evento';
        const EVENT_TYPE_LABELS = { 'Lanzamiento': 'Juego', 'Lanzamiento 7M': '7 metros' };
        const DEFAULT_EVENT_TYPE = 'Lanzamiento';
        const eventTypeCounts = new Map();
        for (const r of records) {
          const v = r[COL_EVENT_TYPE];
          if (v) eventTypeCounts.set(v, (eventTypeCounts.get(v) || 0) + 1);
        }
        const eventTypeOptions = [...eventTypeCounts.entries()]
          .sort((a, b) => b[1] - a[1])
          .map(([value]) => ({ value, label: EVENT_TYPE_LABELS[value] || value }));

        function isSieteMetros() {
          return Boolean(activeFilters.tipoEvento && activeFilters.tipoEvento.selected[0] === 'Lanzamiento 7M');
        }

        function applyModalidadMode(eventType) {
          const is7m = eventType === 'Lanzamiento 7M';
          if (is7m && activeFilters.fase) { activeFilters.fase.selected = []; filterComponents.fase.setSelected([]); }
          if (!is7m && activeFilters.amago) { activeFilters.amago.selected = []; filterComponents.amago.setSelected([]); }
          const zonePanel = document.getElementById('zoneLanzamientoPanel');
          if (zonePanel) zonePanel.hidden = is7m;
        }

        if (eventTypeOptions.length > 1) {
          activeFilters.tipoEvento = { getValue: (r) => r[COL_EVENT_TYPE], selected: [DEFAULT_EVENT_TYPE] };
          document.getElementById('modalidadGroup').hidden = false;
          const modalidadEl = document.getElementById('modalidadChips');
          function renderModalidadChips() {
            const current = activeFilters.tipoEvento.selected[0];
            modalidadEl.innerHTML = eventTypeOptions.map((o) => `
              <button type="button" class="chip ${current === o.value ? 'active' : ''}" data-value="${escapeHtml(o.value)}">${escapeHtml(o.label)}</button>`).join('');
            modalidadEl.querySelectorAll('.chip').forEach((btn) => {
              btn.addEventListener('click', () => {
                if (btn.dataset.value === current) return; // siempre exactamente uno activo
                activeFilters.tipoEvento.selected = [btn.dataset.value];
                applyModalidadMode(btn.dataset.value);
                renderModalidadChips();
                renderStats();
              });
            });
          }
          renderModalidadChips();
          filterComponents.tipoEvento = {
            setSelected: () => { activeFilters.tipoEvento.selected = [DEFAULT_EVENT_TYPE]; applyModalidadMode(DEFAULT_EVENT_TYPE); renderModalidadChips(); }
          };
        }

        function refreshFaseFilter() {
          if (!phaseFilter) return;
          if (isSieteMetros()) { phaseFilter.el.hidden = true; return; }
          const options = computePhaseOptions(filteredExcept('fase'));
          phaseFilter.setOptions(options);
          phaseFilter.el.hidden = options.length <= 1;
        }

        // Filtros simples por columna (sin buscador, ordenados por
        // frecuencia descendente): Mano y Tipo de lanzamiento. Devuelve una
        // función de refresco (o null si nunca hubo variedad suficiente ni
        // la habrá: acotar más un filtro nunca añade valores nuevos).
        function addSimpleFilter(key, fieldLabel, column) {
          function computeOptions(scopedRecords) {
            const counts = new Map();
            for (const r of scopedRecords) {
              const v = r[column];
              if (v) counts.set(v, (counts.get(v) || 0) + 1);
            }
            return [...counts.entries()].sort((a, b) => b[1] - a[1]).map(([value]) => ({ value, label: value }));
          }
          const initialOptions = computeOptions(records);
          if (initialOptions.length <= 1) return null;
          const filter = createDropdownFilter({
            fieldLabel,
            options: initialOptions,
            showSearch: false,
            onChange: (selected) => { activeFilters[key].selected = selected; renderStats(); }
          });
          activeFilters[key] = { getValue: (r) => r[column], selected: [] };
          filterComponents[key] = filter;
          filtersCol.appendChild(filter.el);
          return function refresh() {
            const options = computeOptions(filteredExcept(key));
            filter.setOptions(options);
            filter.el.hidden = options.length <= 1;
          };
        }

        const refreshManoFilter = addSimpleFilter('mano', 'Mano', 'Mano');
        const refreshTipoLanzamientoFilter = addSimpleFilter('tipoLanzamiento', 'Tipo de lanzamiento', 'Tipo de lanzamiento');

        // "Con amago" es un campo tipo casilla en la plantilla: solo se
        // guarda "Sí" cuando está marcado, en blanco si no — nunca hay un
        // segundo valor real "No" que contar, así que addSimpleFilter (que
        // exige >=2 valores distintos) nunca lo mostraría. Se construye
        // aparte, ofreciendo "No" como el hueco en blanco. Solo tiene
        // sentido en un 7 metros.
        let amagoFilter = null;
        if (records.some((r) => r['Con amago'])) {
          amagoFilter = createDropdownFilter({
            fieldLabel: 'Con amago',
            options: [{ value: 'Sí', label: 'Sí' }, { value: '', label: 'No' }],
            showSearch: false,
            onChange: (selected) => { activeFilters.amago.selected = selected; renderStats(); }
          });
          activeFilters.amago = { getValue: (r) => r['Con amago'] || '', selected: [] };
          filterComponents.amago = amagoFilter;
          filtersCol.appendChild(amagoFilter.el);
        }

        function refreshAmagoFilter() {
          if (!amagoFilter) return;
          if (!isSieteMetros()) { amagoFilter.el.hidden = true; return; }
          const present = new Set(filteredExcept('amago').map((r) => r['Con amago'] || ''));
          amagoFilter.el.hidden = present.size <= 1;
        }

        // Estado inicial: en juego (Fase visible, Con amago oculto, Zona de
        // lanzamiento visible) — el mismo camino tanto si hay modalidad para
        // elegir como si no (un equipo sin ningún 7 metros registrado).
        applyModalidadMode(DEFAULT_EVENT_TYPE);

        // Zona de lanzamiento y zona de portería no tienen desplegable propio
        // en la columna de filtros: se activan solo al pulsar sobre el
        // gráfico correspondiente (ver toggleZoneFilter/toggleGoalZoneFilter).
        activeFilters.zonaLanzamiento = { getValue: (r) => parseZoneCode(r[COL_POSITION]), selected: [] };
        activeFilters.zonaPorteria = { getValue: (r) => GOAL_LABEL_TO_CODE[r[COL_GOAL]] || null, selected: [] };
        if (hasPuesto) {
          activeFilters.puesto = { getValue: (r) => POSITION_LABEL_TO_CODE[r[COL_PUESTO]] || null, selected: [] };
        }

        document.getElementById('zonePositionClear').addEventListener('click', () => {
          activeFilters.zonaLanzamiento.selected = [];
          renderStats();
        });
        document.getElementById('goalZoneClear').addEventListener('click', () => {
          activeFilters.zonaPorteria.selected = [];
          renderStats();
        });

        document.getElementById('tableToggle').addEventListener('click', () => {
          const wrap = document.getElementById('tableWrap');
          wrap.hidden = !wrap.hidden;
          document.getElementById('tableToggle').textContent = wrap.hidden ? 'Ver tabla completa ▾' : 'Ocultar tabla ▴';
        });

        document.getElementById('filtersReset').addEventListener('click', () => {
          for (const key of Object.keys(activeFilters)) {
            activeFilters[key].selected = [];
            if (filterComponents[key]) filterComponents[key].setSelected([]);
          }
          renderStats();
        });

        function statTile(value, label) {
          return `<div class="stat-tile"><div class="stat-value">${value}</div><div class="stat-label">${label}</div></div>`;
        }

        // Registros que cumplen todos los filtros activos EXCEPTO los
        // indicados — así el propio gráfico que actúa como filtro (jugador,
        // zona de lanzamiento, zona de portería) sigue mostrando todos sus
        // elementos y se puede volver a pulsar para deseleccionar.
        function filteredExcept(...excludeKeys) {
          return records.filter((r) =>
            Object.entries(activeFilters).every(([key, { getValue, selected }]) =>
              excludeKeys.includes(key) || selected.length === 0 || selected.includes(getValue(r))
            )
          );
        }

        function renderStats() {
          // "Filtrar los filtros": antes de calcular nada, cada filtro
          // dependiente recalcula sus propias opciones a partir de lo que
          // queda tras el resto de filtros activos, y se oculta si ya no
          // puede distinguir nada (una sola opción posible).
          refreshJugadorFilter();
          if (refreshManoFilter) refreshManoFilter();
          if (refreshTipoLanzamientoFilter) refreshTipoLanzamientoFilter();
          refreshFaseFilter();
          refreshAmagoFilter();

          const filtered = filteredExcept();

          const lanzamientos = filtered.length;
          const goles = filtered.filter((r) => /gol/i.test(r['Resultado'] || '')).length;
          const efectividad = lanzamientos > 0 ? ((goles / lanzamientos) * 100).toFixed(1) : '0.0';
          const partidosDistintos = new Set(filtered.map((r) => r[COL_CODE])).size || 1;
          const golesPorPartido = goles / partidosDistintos;
          const golesPorPartidoLabel = Number.isInteger(golesPorPartido) ? golesPorPartido : golesPorPartido.toFixed(1);

          if (hasPuesto) {
            const puestoCode = activeFilters.puesto.selected[0];
            document.getElementById('statHeadlineTitle').textContent = puestoCode
              ? `Resumen · ${POSITION_LABELS[puestoCode]}`
              : 'Resumen';
          }
          document.getElementById('statHeadline').innerHTML =
            statTile(lanzamientos, 'lanzamientos') +
            statTile(goles, 'goles') +
            statTile(`${efectividad}%`, 'efectividad') +
            statTile(golesPorPartidoLabel, 'goles por partido');

          renderPlayerComparison(filteredExcept('jugador'));
          renderZonePositionChart(filteredExcept('zonaLanzamiento'));
          renderGoalZoneChart(filteredExcept('zonaPorteria'));
          if (hasPuesto) renderPositionSelect(filteredExcept('puesto'));
          renderClips(filtered);
          renderDetailTable(filtered);
        }
        tabRefreshers.jugadores = renderStats;

        // Orden por defecto de las jugadas: cronológico (partido > parte >
        // tiempo) — lo usan tanto los Clips como la tabla de detalle (esta
        // última lo sustituye por su propio orden si se pulsa una cabecera).
        function sortChronological(rows) {
          return [...rows].sort((a, b) => {
            const codeA = a[COL_CODE] || '', codeB = b[COL_CODE] || '';
            if (codeA !== codeB) return codeA < codeB ? -1 : 1;
            const partA = a['Parte'] || '', partB = b['Parte'] || '';
            if (partA !== partB) return partA < partB ? -1 : 1;
            return (a['Tiempo de partido'] || '').localeCompare(b['Tiempo de partido'] || '');
          });
        }

        function formatClipTime(sec) {
          sec = Math.max(0, Math.floor(sec));
          return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
        }

        // ── Clips: miniaturas reales de YouTube (img.youtube.com/vi/<id>/...)
        // en vez de la tabla como forma principal de abrir un vídeo — la
        // tabla sigue disponible, colapsada, en "Ver tabla completa". Un tope
        // (CAP) evita renderizar cientos de <img> a la vez si el filtro es
        // muy amplio; el modal de vídeo sigue pudiendo navegar más allá de
        // las tarjetas visibles (currentVideoRows es la lista completa, no
        // solo las mostradas).
        function renderClips(filtered) {
          const panel = document.getElementById('clipsPanel');
          const clipRows = sortChronological(filtered).filter((r) => r[COL_YOUTUBE]);
          if (clipRows.length === 0) { panel.hidden = true; return; }
          panel.hidden = false;

          document.getElementById('clipsCount').textContent = `${clipRows.length} clip${clipRows.length === 1 ? '' : 's'}`;

          const CAP = 24;
          const shown = clipRows.slice(0, CAP);
          const cardsHtml = shown.map((r, i) => {
            const resultado = r['Resultado'] || '';
            const pillClass = resultPillClass(resultado, false);
            const playerLabel = r[COL_PLAYER] ? parsePlayer(r[COL_PLAYER]).label : '';
            const zone = formatZoneLabel(r[COL_POSITION]);
            const context = [r[COL_CODE], r['Parte'], r['Tiempo de partido']].filter(Boolean).join(' · ');
            const startSec = Math.max(0, Math.floor(Number(r[COL_CLIP_START]) || 0));
            return `
              <button type="button" class="clip-card" data-idx="${i}">
                <div class="clip-thumb">
                  <img src="https://img.youtube.com/vi/${encodeURIComponent(r[COL_YOUTUBE])}/mqdefault.jpg" alt="" loading="lazy" />
                  <span class="clip-play">▶</span>
                  <span class="clip-time">${formatClipTime(startSec)}</span>
                </div>
                <div class="clip-meta">
                  ${resultado ? `<span class="result-pill ${pillClass}">${escapeHtml(resultado)}</span>` : ''}
                  <span class="clip-player">${escapeHtml(playerLabel)}</span>
                </div>
                <div class="clip-sub">${escapeHtml([zone, context].filter(Boolean).join(' · '))}</div>
              </button>`;
          }).join('');
          const moreHtml = clipRows.length > CAP
            ? `<div class="clips-more">+${clipRows.length - CAP} clips más — abre "Ver tabla completa" para verlos todos</div>`
            : '';
          document.getElementById('filmstrip').innerHTML = cardsHtml + moreHtml;

          document.querySelectorAll('#filmstrip .clip-card').forEach((card) => {
            const idx = Number(card.dataset.idx);
            card.addEventListener('click', () => {
              currentVideoRows = clipRows;
              openVideoModal(clipRows[idx], idx);
            });
          });
        }

        // ── Selector de puesto: navegación principal (sustituye al antiguo
        // gráfico "Efectividad por puesto" — misma agregación, pero como
        // tarjetas grandes arriba del todo en vez de una barra más entre
        // otras). Sigue actuando como filtro clicable vía togglePuestoFilter,
        // ya usado también por el detalle de jugador. No incluye "Portero"
        // (PT): un portero prácticamente no lanza.
        function renderPositionSelect(filtered) {
          const wrap = document.getElementById('positionSelect');
          // El puesto del lanzador no tiene sentido en un 7 metros — al
          // contrario que el resto de filtros, aquí no se recalculan
          // opciones, se deshabilita entero y se limpia cualquier selección
          // previa (ver applyModalidadMode, que ya lo hacía para Fase/Amago).
          if (isSieteMetros()) {
            if (activeFilters.puesto.selected.length > 0) activeFilters.puesto.selected = [];
            wrap.innerHTML = POSITION_ORDER
              .filter((code) => code !== 'PT')
              .map((code) => `<button type="button" class="pos-card" disabled>
                <div class="pos-name">${POSITION_LABELS[code]}</div>
                <div class="pos-figures">No aplica en 7 metros</div>
              </button>`).join('');
            return;
          }
          const byPosition = new Map();
          for (const r of filtered) {
            const code = POSITION_LABEL_TO_CODE[r[COL_PUESTO]];
            if (!code) continue;
            const entry = byPosition.get(code) || { lanzamientos: 0, goles: 0 };
            entry.lanzamientos++;
            if (/gol/i.test(r['Resultado'] || '')) entry.goles++;
            byPosition.set(code, entry);
          }
          const selected = activeFilters.puesto.selected;
          wrap.innerHTML = POSITION_ORDER
            .filter((code) => code !== 'PT')
            .map((code) => {
              const data = byPosition.get(code) || { lanzamientos: 0, goles: 0 };
              const eff = data.lanzamientos ? Math.round((data.goles / data.lanzamientos) * 100) : 0;
              const isActive = selected.includes(code);
              return `<button type="button" class="pos-card ${isActive ? 'active' : ''}" data-code="${code}">
                <div class="pos-name">${POSITION_LABELS[code]}</div>
                <div class="pos-figures">${data.lanzamientos} lanz. · ${eff}% efic.</div>
              </button>`;
            }).join('');
          document.querySelectorAll('#positionSelect .pos-card').forEach((btn) => {
            btn.addEventListener('click', () => togglePuestoFilter(btn.dataset.code));
          });
        }

        // ── Comparativa de jugadores: siempre visible (actúa también como
        // filtro clicable), salvo que no haya lanzamientos que mostrar.
        function renderPlayerComparison(filtered) {
          const panel = document.getElementById('playerComparisonPanel');
          const byPlayer = new Map();
          for (const r of filtered) {
            const raw = r[COL_PLAYER];
            if (!raw) continue;
            const entry = byPlayer.get(raw) || { lanzamientos: 0, goles: 0 };
            entry.lanzamientos++;
            if (/gol/i.test(r['Resultado'] || '')) entry.goles++;
            byPlayer.set(raw, entry);
          }

          if (byPlayer.size === 0) { panel.hidden = true; return; }
          panel.hidden = false;

          const players = [...byPlayer.entries()]
            .map(([raw, { lanzamientos, goles }]) => {
              const { label } = parsePlayer(raw);
              return {
                raw,
                fullLabel: label,
                lanzamientos,
                goles,
                efectividad: lanzamientos > 0 ? Math.round((goles / lanzamientos) * 100) : 0
              };
            })
            .sort((a, b) => b.lanzamientos - a.lanzamientos);

          const maxLanz = Math.max(1, ...players.map((p) => p.lanzamientos));
          const selectedPlayers = activeFilters.jugador.selected;
          document.getElementById('playerComparisonChart').innerHTML = players.map((p) => {
            const isActive = selectedPlayers.includes(p.raw);
            return `
              <div class="scorer-row ${isActive ? 'active' : ''}" data-player="${escapeHtml(p.raw)}">
                <div class="scorer-head"><span class="scorer-name">${escapeHtml(p.fullLabel)}</span><span class="scorer-eff">${p.lanzamientos ? p.efectividad + '%' : '—'}</span></div>
                <div class="scorer-bars">
                  <div class="scorer-bar-track"><div class="scorer-bar-fill lanz" style="width:${(p.lanzamientos / maxLanz * 100).toFixed(0)}%"></div></div>
                  <div class="scorer-bar-track"><div class="scorer-bar-fill gol" style="width:${(p.goles / maxLanz * 100).toFixed(0)}%"></div></div>
                </div>
                <div class="scorer-figures"><span>${p.lanzamientos} lanz.</span><span>${p.goles} goles</span></div>
              </div>`;
          }).join('');

          document.querySelectorAll('#playerComparisonChart .scorer-row').forEach((row) => {
            row.addEventListener('click', () => togglePlayerFilter(row.dataset.player));
          });
        }

        // Pulsar la barra de un jugador lo deja como único filtro de Jugador
        // (y se refleja también en el desplegable); pulsar el mismo de nuevo
        // vuelve a "todos" — igual que el botón SOLO de los desplegables.
        function togglePlayerFilter(raw) {
          const cur = activeFilters.jugador.selected;
          const next = (cur.length === 1 && cur[0] === raw) ? [] : [raw];
          activeFilters.jugador.selected = next;
          playerFilter.setSelected(next);
          renderStats();
        }

        function togglePuestoFilter(code) {
          const cur = activeFilters.puesto.selected;
          activeFilters.puesto.selected = (cur.length === 1 && cur[0] === code) ? [] : [code];
          renderStats();
        }

        // ── Zona de lanzamiento: mismas 13 zonas e imagen de pista que usa
        // VideoCuts, con un círculo por zona (área proporcional a los
        // lanzamientos, no el radio — si no, el ojo exagera la diferencia)
        // y la misma etiqueta "goles/lanzamientos (%)" que en la comparativa.
        // (parseZoneCode, zoneCentroid, efficiencyColor... están arriba del
        // todo, fuera de este bloque: los usan tanto jugadores como portero)

        function renderZonePositionChart(filtered) {
          const byZone = new Map();
          for (const r of filtered) {
            const code = parseZoneCode(r[COL_POSITION]);
            if (!code) continue;
            const entry = byZone.get(code) || { lanzamientos: 0, goles: 0 };
            entry.lanzamientos++;
            if (/gol/i.test(r['Resultado'] || '')) entry.goles++;
            byZone.set(code, entry);
          }

          const maxCount = Math.max(1, ...[...byZone.values()].map((z) => z.lanzamientos));
          const MIN_R = 10, MAX_R = 46;
          const selectedZones = activeFilters.zonaLanzamiento.selected;

          const bubblesSvg = SHOT_ZONES.map((z) => {
            const data = byZone.get(z.code);
            if (!data || data.lanzamientos === 0) return '';
            const { cx, cy } = zoneCentroid(z.points);
            // Área ∝ lanzamientos: radio ∝ raíz cuadrada.
            const r = MIN_R + (MAX_R - MIN_R) * Math.sqrt(data.lanzamientos / maxCount);
            const efectividad = Math.round((data.goles / data.lanzamientos) * 100);
            const color = efficiencyColor(efectividad);
            const labelBelow = cy + r + 20 <= COURT_H;
            const labelY = labelBelow ? cy + r + 14 : cy - r - 8;
            const isSelected = selectedZones.includes(z.code);
            const isDimmed = selectedZones.length > 0 && !isSelected;
            const strokeColor = isSelected ? '#ffffff' : color;
            const strokeWidth = isSelected ? 3 : 1.5;
            return `
              <g class="zone-bubble-clickable" data-code="${z.code}" opacity="${isDimmed ? 0.35 : 1}">
                <circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}" fill-opacity="0.8" stroke="${strokeColor}" stroke-width="${strokeWidth}">
                  <title>${escapeHtml(z.name)} — ${data.goles}/${data.lanzamientos} (${efectividad}%)</title>
                </circle>
                <text x="${cx}" y="${labelY}" text-anchor="middle" fill="#e0e0e0" font-size="12" font-weight="600" style="pointer-events:none">${data.goles}/${data.lanzamientos} (${efectividad}%)</text>
              </g>`;
          }).join('');

          document.getElementById('zonePositionChart').innerHTML = `
            <svg viewBox="0 0 ${COURT_W} ${COURT_H}" class="zone-bubble-svg" role="img" aria-label="Zona de lanzamiento: lanzamientos y goles por zona">
              <image href="../assets/half-court.png" x="0" y="0" width="${COURT_W}" height="${COURT_H}" />
              ${bubblesSvg}
            </svg>`;

          wireZoneInteractions(document.querySelectorAll('#zonePositionChart .zone-bubble-clickable'), {
            onToggle: toggleZoneFilter,
            onSelectOnly: selectOnlyZoneFilter
          });
          document.getElementById('zonePositionClear').disabled = selectedZones.length === 0;
        }

        function toggleZoneFilter(code) {
          const cur = activeFilters.zonaLanzamiento.selected;
          activeFilters.zonaLanzamiento.selected = cur.includes(code) ? cur.filter((c) => c !== code) : [...cur, code];
          renderStats();
        }

        function selectOnlyZoneFilter(code) {
          activeFilters.zonaLanzamiento.selected = [code];
          renderStats();
        }

        // ── Zona de portería: rejilla 3x3 + franjas de "fuera", misma
        // geometría que GoalZonePicker.tsx. Aquí sí se colorea la propia
        // zona (no un círculo, la rejilla ya está a tamaño fijo) con el
        // mismo degradado rojo→amarillo→verde por efectividad y la misma
        // etiqueta "goles/lanzamientos (%)".
        function renderGoalZoneChart(filtered) {
          const byZone = new Map();
          for (const r of filtered) {
            const code = GOAL_LABEL_TO_CODE[r[COL_GOAL]];
            if (!code) continue;
            const entry = byZone.get(code) || { lanzamientos: 0, goles: 0 };
            entry.lanzamientos++;
            if (/gol/i.test(r['Resultado'] || '')) entry.goles++;
            byZone.set(code, entry);
          }

          const { cols, cellW, cellH, post, outSide, outTop } = GOAL_LAYOUT;
          const gridW = cols * cellW;
          const gridH = 3 * cellH;
          const gridX = outSide + post;
          const gridY = outTop + post;
          const width = gridW + post * 2 + outSide * 2;
          const height = gridH + post * 2 + outTop;
          const selectedZones = activeFilters.zonaPorteria.selected;

          function cellSvg(code, x, y, w, h) {
            const data = byZone.get(code);
            if (!data || data.lanzamientos === 0) {
              return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#1c1c1c" stroke="#333" stroke-width="1" />`;
            }
            const efectividad = Math.round((data.goles / data.lanzamientos) * 100);
            const rgb = efficiencyColorRGB(efectividad);
            const fill = rgbStr(rgb);
            const textColor = textColorOn(rgb);
            const cx = x + w / 2, cy = y + h / 2;
            const isSelected = selectedZones.includes(code);
            const isDimmed = selectedZones.length > 0 && !isSelected;
            const strokeColor = isSelected ? '#ffffff' : fill;
            const strokeWidth = isSelected ? 3 : 1;
            const line1 = `${data.goles}/${data.lanzamientos}`;
            const line2 = `(${efectividad}%)`;
            // Las franjas de "fuera" (arriba/izquierda/derecha) son muy
            // finas — un lanzamiento que acaba ahí sí puede tener datos que
            // mostrar, pero las dos líneas de texto a tamaño normal no
            // caben: la de arriba es baja pero ancha (una sola línea más
            // compacta cabe de sobra), las de los lados son estrechas pero
            // altas (caben las dos líneas de siempre, pero más pequeñas).
            const textSvg = h < 32
              ? `<text x="${cx}" y="${cy + 3}" text-anchor="middle" fill="${textColor}" font-size="9" font-weight="700" style="pointer-events:none">${line1} ${line2}</text>`
              : w < 32
              ? `<text x="${cx}" y="${cy - 2}" text-anchor="middle" fill="${textColor}" font-size="9" font-weight="700" style="pointer-events:none">${line1}</text>
                <text x="${cx}" y="${cy + 9}" text-anchor="middle" fill="${textColor}" font-size="8" style="pointer-events:none">${line2}</text>`
              : `<text x="${cx}" y="${cy - 3}" text-anchor="middle" fill="${textColor}" font-size="12" font-weight="700" style="pointer-events:none">${line1}</text>
                <text x="${cx}" y="${cy + 11}" text-anchor="middle" fill="${textColor}" font-size="10" style="pointer-events:none">${line2}</text>`;
            return `
              <g class="goal-cell-clickable" data-code="${code}" opacity="${isDimmed ? 0.35 : 1}">
                <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}" fill-opacity="0.85" stroke="${strokeColor}" stroke-width="${strokeWidth}">
                  <title>${escapeHtml(GOAL_LABELS[code])} — ${line1} ${line2}</title>
                </rect>
                ${textSvg}
              </g>`;
          }

          const inner = GOAL_INNER_ZONES.map((code, i) => {
            const col = i % cols;
            const row = Math.floor(i / cols);
            return cellSvg(code, gridX + col * cellW, gridY + row * cellH, cellW, cellH);
          }).join('');

          const outer = cellSvg('out-top', gridX, 0, gridW, outTop) +
            cellSvg('out-left', 0, gridY, outSide, gridH) +
            cellSvg('out-right', gridX + gridW, gridY, outSide, gridH);

          document.getElementById('goalZoneChart').innerHTML = `
            <svg viewBox="0 0 ${width} ${height}" class="goal-zone-svg" role="img" aria-label="Zona de portería: lanzamientos y goles por zona">
              ${outer}
              <rect x="${gridX - post / 2}" y="${gridY - post / 2}" width="${gridW + post}" height="${gridH + post}" fill="none" stroke="#666" stroke-width="${post}" />
              ${inner}
            </svg>`;

          wireZoneInteractions(document.querySelectorAll('#goalZoneChart .goal-cell-clickable'), {
            onToggle: toggleGoalZoneFilter,
            onSelectOnly: selectOnlyGoalZoneFilter
          });
          document.getElementById('goalZoneClear').disabled = selectedZones.length === 0;
        }

        function toggleGoalZoneFilter(code) {
          const cur = activeFilters.zonaPorteria.selected;
          activeFilters.zonaPorteria.selected = cur.includes(code) ? cur.filter((c) => c !== code) : [...cur, code];
          renderStats();
        }

        function selectOnlyGoalZoneFilter(code) {
          activeFilters.zonaPorteria.selected = [code];
          renderStats();
        }

        // El modal de vídeo (openVideoModal, closeVideoModal, goToVideo,
        // replayVideo...) vive arriba del todo, fuera de este bloque: lo usan
        // tanto esta tabla como la de la pestaña de portero.

        // El puesto va entre paréntesis junto al jugador ("11 PABLO X (EI)"),
        // no como columna aparte; y la zona de lanzamiento se lee de la
        // misma columna "Posición" que usa el mapa de calor.
        function formatPlayerCell(r) {
          if (!r[COL_PLAYER]) return '';
          const { label } = parsePlayer(r[COL_PLAYER]);
          const code = POSITION_LABEL_TO_CODE[r[COL_PUESTO]];
          return code ? `${label} (${code})` : label;
        }

        // Columnas de la tabla: "get" es el valor por el que se ordena al
        // pulsar la cabecera (numérico para Jugador, así ordena por dorsal
        // y no como texto); "display" es lo que se ve si difiere de "get".
        let detailSort = { key: null, dir: 'asc' };

        const DETAIL_COLUMNS = [
          { key: 'partido', label: 'Partido', get: (r) => r[COL_CODE] || '' },
          { key: 'parte', label: 'Parte', get: (r) => r['Parte'] || '' },
          { key: 'tiempo', label: 'Tiempo', get: (r) => r['Tiempo de partido'] || '' },
          { key: 'jugador', label: 'Jugador', get: (r) => r[COL_PLAYER] ? parsePlayer(r[COL_PLAYER]).dorsal : Infinity, display: formatPlayerCell },
          { key: 'zona', label: 'Zona', get: (r) => formatZoneLabel(r[COL_POSITION]) },
          { key: 'tipo', label: 'Tipo', get: (r) => r['Tipo de lanzamiento'] || '' },
          { key: 'mano', label: 'Mano', get: (r) => r['Mano'] || '' },
          { key: 'resultado', label: 'Resultado', get: (r) => r['Resultado'] || '', cls: (r) => (/gol/i.test(r['Resultado'] || '') ? 'is-gol' : /parada/i.test(r['Resultado'] || '') ? 'is-parada' : '') }
        ];

        function renderDetailTable(filtered) {
          const panel = document.getElementById('detailTablePanel');
          if (filtered.length === 0) { panel.hidden = true; return; }
          panel.hidden = false;

          // Orden por defecto: cronológico (partido > parte > tiempo, mismo
          // criterio que los Clips). Si se ha pulsado una cabecera, se
          // reordena por esa columna pero de forma estable, así los empates
          // mantienen el orden cronológico.
          let rows = sortChronological(filtered);

          if (detailSort.key) {
            const col = DETAIL_COLUMNS.find((c) => c.key === detailSort.key);
            const dir = detailSort.dir === 'desc' ? -1 : 1;
            rows = rows
              .map((r, i) => ({ r, i }))
              .sort((a, b) => {
                const va = col.get(a.r), vb = col.get(b.r);
                const cmp = typeof va === 'number' && typeof vb === 'number'
                  ? va - vb
                  : String(va).localeCompare(String(vb), 'es');
                return cmp !== 0 ? cmp * dir : a.i - b.i;
              })
              .map(({ r }) => r);
          }

          const headCells = DETAIL_COLUMNS.map((col) => {
            const active = detailSort.key === col.key;
            const arrow = active ? (detailSort.dir === 'desc' ? ' ▼' : ' ▲') : '';
            return `<th class="sortable" data-key="${col.key}">${escapeHtml(col.label)}${arrow}</th>`;
          }).join('');
          const head = `<thead><tr>${headCells}<th>Vídeo</th></tr></thead>`;

          // Índice dentro de "solo las filas con vídeo" (no de "rows" entero),
          // que es la lista que usan luego los botones Anterior/Siguiente —
          // asignada a currentVideoRows solo al pulsar "Ver" (no aquí, al
          // renderizar), para no pisar la lista de los Clips si ambos
          // paneles están visibles a la vez.
          const videoRows = rows.filter((r) => r[COL_YOUTUBE]);
          let videoCounter = 0;

          const body = rows.map((r) => {
            const cells = DETAIL_COLUMNS.map((col) => {
              const value = col.display ? col.display(r) : col.get(r);
              const cls = col.cls ? col.cls(r) : '';
              return `<td class="${cls}">${escapeHtml(value)}</td>`;
            }).join('');
            const videoCell = r[COL_YOUTUBE]
              ? `<button type="button" class="video-link" data-row-idx="${videoCounter++}">▶ Ver</button>`
              : '<span class="detail-table-empty">—</span>';
            return `<tr>${cells}<td>${videoCell}</td></tr>`;
          }).join('');

          document.getElementById('detailTable').innerHTML = head + `<tbody>${body}</tbody>`;

          document.querySelectorAll('#detailTable .video-link').forEach((btn) => {
            const idx = Number(btn.dataset.rowIdx);
            btn.addEventListener('click', () => { currentVideoRows = videoRows; openVideoModal(videoRows[idx], idx); });
          });

          document.querySelectorAll('#detailTable th.sortable').forEach((th) => {
            th.addEventListener('click', () => {
              const key = th.dataset.key;
              detailSort = detailSort.key === key
                ? { key, dir: detailSort.dir === 'asc' ? 'desc' : 'asc' }
                : { key, dir: 'asc' };
              renderDetailTable(filtered);
            });
          });
        }

        renderStats();
      }

      // Portero: mismas tres visualizaciones que en Jugadores (KPIs, dos
      // mapas de zona, tabla de detalle + vídeo) pero desde el punto de
      // vista del portero — el Puesto es siempre "Portero" (desplegable de
      // jugador plano, sin agrupar) y el % clave es de paradas, no de goles.
      const gkRecords = await fetchTeamRecords(channelId, team, 'portero');
      await applyCorrections(gkRecords, channelId, 'portero');
      if (gkRecords.length === 0) {
        panels.portero.innerHTML = '<div class="empty-state">Sin datos de portero para este equipo todavía.</div>';
      } else {

        panels.portero.innerHTML = `
          <button type="button" class="filters-toggle" id="filtersToggleGk">☰ Filtros</button>
          <div class="dash-layout">
            <aside class="dash-filters" id="dashFiltersGk">
              <div class="dash-filters-title-row">
                <div class="dash-filters-title">Filtros</div>
                <button type="button" class="filters-reset" id="filtersResetGk">Limpiar todo</button>
              </div>
              <div class="filters-col" id="filtersColGk"></div>
            </aside>
            <main class="dash-main">
              <div class="panel stat-headline" id="statHeadlineGk"></div>
              <div class="panel" id="gkComparisonPanel" hidden>
                <div class="panel-title">Comparativa de porteros</div>
                <div class="chart-legend">
                  <span class="chart-legend-item"><span class="chart-legend-swatch" style="background:#0ca30c"></span>Paradas</span>
                  <span class="chart-legend-item"><span class="chart-legend-swatch" style="background:#d03b3b"></span>Goles</span>
                </div>
                <div id="gkComparisonChart"></div>
              </div>
              <div class="zones-row">
                <div class="panel">
                  <div class="panel-title-row">
                    <div class="panel-title">Zona de lanzamiento rival</div>
                    <button type="button" class="zone-clear-btn" id="zonePositionClearGk" disabled>Borrar selección</button>
                  </div>
                  <div id="zonePositionChartGk"></div>
                </div>
                <div class="panel">
                  <div class="panel-title-row">
                    <div class="panel-title">Zona de portería</div>
                    <button type="button" class="zone-clear-btn" id="goalZoneClearGk" disabled>Borrar selección</button>
                  </div>
                  <div id="goalZoneChartGk"></div>
                </div>
              </div>
              <div class="panel" id="detailTablePanelGk" hidden>
                <div class="panel-title">Detalle de lanzamientos</div>
                <div class="detail-table-wrap">
                  <table class="detail-table" id="detailTableGk"></table>
                </div>
              </div>
            </main>
          </div>`;

        setupFiltersToggle(document.getElementById('filtersToggleGk'), document.getElementById('dashFiltersGk'));

        function gkFigure(n, label) {
          return `<div class="figure"><span class="n">${n}</span><span class="l">${label}</span></div>`;
        }

        const filtersColGk = document.getElementById('filtersColGk');
        const gkActiveFilters = {}; // key -> { getValue, selected }
        const gkFilterComponents = {}; // key -> { setSelected }

        function addGkFilter(key, fieldLabel, column) {
          const values = [...new Set(gkRecords.map((r) => r[column]).filter(Boolean))].sort();
          const filter = createDropdownFilter({
            fieldLabel,
            options: values.map((v) => ({ value: v, label: v })),
            onChange: (selected) => { gkActiveFilters[key].selected = selected; renderGkStats(); }
          });
          gkActiveFilters[key] = { getValue: (r) => r[column], selected: [] };
          gkFilterComponents[key] = filter;
          filtersColGk.appendChild(filter.el);
        }

        addGkFilter('partido', 'Partido', COL_CODE);

        const gkTimeFilter = createTreeDropdownFilter({
          fieldLabel: 'Tiempo de juego',
          groups: buildTimeTree(),
          onChange: (selected) => { gkActiveFilters.tiempo.selected = selected; renderGkStats(); }
        });
        gkActiveFilters.tiempo = { getValue: (r) => computeTimeBucketKey(r), selected: [] };
        gkFilterComponents.tiempo = gkTimeFilter;
        filtersColGk.appendChild(gkTimeFilter.el);

        // Portero: el Puesto es siempre "Portero", así que aquí no hace
        // falta el árbol puesto > jugador que sí usa la pestaña de
        // Jugadores — un desplegable plano, ordenado por dorsal, basta.
        const gkPlayerOptions = [...new Set(gkRecords.map((r) => r[COL_PLAYER]).filter(Boolean))]
          .map((raw) => ({ value: raw, ...parsePlayer(raw) }))
          .sort((a, b) => a.dorsal - b.dorsal)
          .map(({ value, label }) => ({ value, label }));
        const gkPlayerFilter = createDropdownFilter({
          fieldLabel: 'Portero',
          options: gkPlayerOptions,
          onChange: (selected) => { gkActiveFilters.jugador.selected = selected; renderGkStats(); }
        });
        gkActiveFilters.jugador = { getValue: (r) => r[COL_PLAYER], selected: [] };
        gkFilterComponents.jugador = gkPlayerFilter;
        filtersColGk.appendChild(gkPlayerFilter.el);

        // Filtros simples por columna (sin buscador, ordenados por
        // frecuencia descendente), igual que Mano/Tipo de lanzamiento en
        // Jugadores: Posición portero y Tipo de lanzamiento.
        function addGkSimpleFilter(key, fieldLabel, column) {
          const counts = new Map();
          for (const r of gkRecords) {
            const v = r[column];
            if (v) counts.set(v, (counts.get(v) || 0) + 1);
          }
          const options = [...counts.entries()]
            .sort((a, b) => b[1] - a[1])
            .map(([value]) => ({ value, label: value }));
          if (options.length <= 1) return;
          const filter = createDropdownFilter({
            fieldLabel,
            options,
            showSearch: false,
            onChange: (selected) => { gkActiveFilters[key].selected = selected; renderGkStats(); }
          });
          gkActiveFilters[key] = { getValue: (r) => r[column], selected: [] };
          gkFilterComponents[key] = filter;
          filtersColGk.appendChild(filter.el);
        }

        addGkSimpleFilter('posicionPortero', 'Posición portero', COL_GK_POSITION);
        addGkSimpleFilter('tipoLanzamiento', 'Tipo de lanzamiento', 'Tipo de lanzamiento');
        addGkSimpleFilter('posturaPortero', 'Postura portero', COL_GK_STANCE);

        // Modalidad: en el CSV de portero no hay una columna "Tipo de
        // evento" como en Jugadores — se deriva combinando los booleanos
        // "Lanzamiento 7M" y "Contraataque" (como mucho uno de los dos
        // estará marcado a la vez; si ninguno lo está, es de juego normal).
        // Ojo: "Contraataque" no siempre es "Sí"/"" — algún CSV trae "No"
        // explícito, que igualmente cuenta como "no es contraataque" (si se
        // comprobara con un simple if(valor) un "No" no vacío colaría como
        // verdadero).
        function gkModality(r) {
          if (r['Lanzamiento 7M'] === 'Sí') return '7 metros';
          if (r['Contraataque'] === 'Sí') return 'Contraataques';
          return 'Juego';
        }
        const gkModalityCounts = new Map();
        for (const r of gkRecords) {
          const v = gkModality(r);
          gkModalityCounts.set(v, (gkModalityCounts.get(v) || 0) + 1);
        }
        const gkModalityOptions = [...gkModalityCounts.entries()]
          .sort((a, b) => b[1] - a[1])
          .map(([value]) => ({ value, label: value }));
        if (gkModalityOptions.length > 1) {
          const gkModalityFilter = createDropdownFilter({
            fieldLabel: 'Modalidad',
            options: gkModalityOptions,
            showSearch: false,
            onChange: (selected) => { gkActiveFilters.modalidad.selected = selected; renderGkStats(); }
          });
          gkActiveFilters.modalidad = { getValue: gkModality, selected: [] };
          gkFilterComponents.modalidad = gkModalityFilter;
          filtersColGk.appendChild(gkModalityFilter.el);
        }

        // Zona de lanzamiento y zona de portería, igual que en Jugadores,
        // se activan solo al pulsar sobre su gráfico, sin desplegable propio.
        gkActiveFilters.zonaLanzamiento = { getValue: (r) => parseZoneCode(r[COL_POSITION]), selected: [] };
        gkActiveFilters.zonaPorteria = { getValue: (r) => GOAL_LABEL_TO_CODE[r[COL_GOAL]] || null, selected: [] };

        document.getElementById('zonePositionClearGk').addEventListener('click', () => {
          gkActiveFilters.zonaLanzamiento.selected = [];
          renderGkStats();
        });
        document.getElementById('goalZoneClearGk').addEventListener('click', () => {
          gkActiveFilters.zonaPorteria.selected = [];
          renderGkStats();
        });

        document.getElementById('filtersResetGk').addEventListener('click', () => {
          for (const key of Object.keys(gkActiveFilters)) {
            gkActiveFilters[key].selected = [];
            if (gkFilterComponents[key]) gkFilterComponents[key].setSelected([]);
          }
          renderGkStats();
        });

        function gkFilteredExcept(...excludeKeys) {
          return gkRecords.filter((r) =>
            Object.entries(gkActiveFilters).every(([key, { getValue, selected }]) =>
              excludeKeys.includes(key) || selected.length === 0 || selected.includes(getValue(r))
            )
          );
        }

        // % paradas = paradas / (goles + paradas) — a propósito, no paradas
        // / total de lanzamientos: puede haber lanzamientos "Fuera" en los
        // que el portero no interviene, y no deben contar en este cociente
        // (aunque sí en el nº de lanzamientos recibidos y en el tamaño de
        // las burbujas/celdas de los mapas de zona).
        function savePct(paradas, goles) {
          const denom = paradas + goles;
          return denom > 0 ? Math.round((paradas / denom) * 100) : null;
        }

        function renderGkStats() {
          const filtered = gkFilteredExcept();

          const lanzamientos = filtered.length;
          const paradas = filtered.filter((r) => r['Resultado'] === 'Parada').length;
          const goles = filtered.filter((r) => r['Resultado'] === 'Gol').length;
          const pct = savePct(paradas, goles);

          document.getElementById('statHeadlineGk').innerHTML =
            gkFigure(lanzamientos, 'lanzamientos recibidos') +
            gkFigure(paradas, 'paradas') +
            gkFigure(goles, 'goles encajados') +
            gkFigure(pct === null ? '—' : `${pct}%`, '% paradas');

          renderGkComparisonChart(gkFilteredExcept('jugador'));
          renderGkZonePositionChart(gkFilteredExcept('zonaLanzamiento'));
          renderGkGoalZoneChart(gkFilteredExcept('zonaPorteria'));
          renderGkDetailTable(filtered);
        }
        tabRefreshers.portero = renderGkStats;

        // ── Comparativa de porteros: solo tiene sentido si el CSV trae más
        // de un portero (p.ej. titular + suplente) — con uno solo sería la
        // misma información que el KPI de arriba. Barras horizontales, no
        // verticales como en Jugadores: aquí como mucho hay 2-3 porteros,
        // así que apilar sus nombres en filas cabe mejor que en columnas.
        // También actúa como filtro clicable, igual que el resto de gráficos.
        function renderGkComparisonChart(filtered) {
          const panel = document.getElementById('gkComparisonPanel');
          const byPlayer = new Map();
          for (const r of filtered) {
            const raw = r[COL_PLAYER];
            if (!raw) continue;
            const entry = byPlayer.get(raw) || { paradas: 0, goles: 0, total: 0 };
            entry.total++;
            if (r['Resultado'] === 'Parada') entry.paradas++;
            else if (r['Resultado'] === 'Gol') entry.goles++;
            byPlayer.set(raw, entry);
          }

          if (byPlayer.size <= 1) { panel.hidden = true; return; }
          panel.hidden = false;

          const keepers = [...byPlayer.entries()]
            .map(([raw, { paradas, goles, total }]) => {
              const { dorsal, label } = parsePlayer(raw);
              return { raw, label, dorsalLabel: `#${dorsal}`, paradas, goles, total, pct: savePct(paradas, goles) };
            })
            .sort((a, b) => b.total - a.total);

          document.getElementById('gkComparisonChart').innerHTML = buildGkComparisonSVG(keepers);

          document.querySelectorAll('#gkComparisonChart .gk-bar-group').forEach((g) => {
            g.addEventListener('click', () => toggleGkComparisonFilter(g.dataset.player));
          });
        }

        function toggleGkComparisonFilter(raw) {
          const cur = gkActiveFilters.jugador.selected;
          const next = (cur.length === 1 && cur[0] === raw) ? [] : [raw];
          gkActiveFilters.jugador.selected = next;
          gkPlayerFilter.setSelected(next);
          renderGkStats();
        }

        function buildGkComparisonSVG(keepers) {
          const rowH = 50;
          const marginTop = 22, marginBottom = 14, marginLeft = 150, marginRight = 95;
          const W = 800;
          const plotW = W - marginLeft - marginRight;
          const H = marginTop + marginBottom + keepers.length * rowH;
          const barH = 16, gap = 3;
          const axisMax = niceMax(Math.max(...keepers.map((k) => Math.max(k.paradas, k.goles))));
          const COLOR_PARADAS = '#0ca30c';
          const COLOR_GOLES = '#d03b3b';
          const TEXT_MUTED = '#898781';
          const TEXT_SECONDARY = '#c3c2b7';
          const GRID = '#2c2c2a';
          const AXIS = '#383835';
          const selectedPlayers = gkActiveFilters.jugador.selected;

          let gridSvg = '';
          for (let v = 0; v <= axisMax; v += 5) {
            const x = marginLeft + (v / axisMax) * plotW;
            gridSvg += `<line x1="${x}" y1="${marginTop - 6}" x2="${x}" y2="${H - marginBottom + 2}" stroke="${v === 0 ? AXIS : GRID}" stroke-width="1" />`;
            gridSvg += `<text x="${x}" y="${marginTop - 10}" text-anchor="middle" fill="${TEXT_MUTED}" font-size="10">${v}</text>`;
          }

          const rowsSvg = keepers.map((k, i) => {
            const rowY = marginTop + i * rowH;
            const centerY = rowY + rowH / 2;
            const paradasW = (k.paradas / axisMax) * plotW;
            const golesW = (k.goles / axisMax) * plotW;
            const paradasY = centerY - barH - gap / 2;
            const golesY = centerY + gap / 2;

            const isSelected = selectedPlayers.includes(k.raw);
            const isDimmed = selectedPlayers.length > 0 && !isSelected;
            const highlight = isSelected ? ` stroke="#fff" stroke-width="1.5"` : '';
            const pctLabel = k.pct === null ? '—' : `${k.pct}%`;

            // Nombre completo si cabe en el margen izquierdo, si no el
            // dorsal — mismo criterio que en la comparativa de Jugadores,
            // adaptado a que aquí el hueco disponible es horizontal, no el
            // ancho de una columna.
            const CHAR_W = 6.2;
            const fitsFull = k.label.length * CHAR_W <= marginLeft - 14;
            const rowLabel = fitsFull ? k.label : k.dorsalLabel;

            return `
              <g class="gk-bar-group" data-player="${escapeHtml(k.raw)}" opacity="${isDimmed ? 0.35 : 1}">
                <rect x="0" y="${rowY}" width="${W}" height="${rowH}" fill="transparent" />
                <text x="${marginLeft - 10}" y="${centerY}" text-anchor="end" dominant-baseline="middle" fill="${TEXT_SECONDARY}" font-size="12"><title>${escapeHtml(k.label)}</title>${escapeHtml(rowLabel)}</text>
                <rect x="${marginLeft}" y="${paradasY}" width="${Math.max(0, paradasW)}" height="${barH}" rx="4" fill="${COLOR_PARADAS}"${highlight}><title>${escapeHtml(k.label)} — Paradas: ${k.paradas}</title></rect>
                <rect x="${marginLeft}" y="${golesY}" width="${Math.max(0, golesW)}" height="${barH}" rx="4" fill="${COLOR_GOLES}"${highlight}><title>${escapeHtml(k.label)} — Goles: ${k.goles}</title></rect>
                <text x="${marginLeft + plotW + 10}" y="${centerY}" dominant-baseline="middle" fill="${TEXT_MUTED}" font-size="11">${k.paradas}/${k.paradas + k.goles} (${pctLabel})</text>
              </g>`;
          }).join('');

          return `<svg viewBox="0 0 ${W} ${H}" class="player-chart-svg" role="img" aria-label="Comparativa de porteros: paradas y goles">
            ${gridSvg}
            ${rowsSvg}
          </svg>`;
        }

        // ── Zona de lanzamiento rival: mismas 13 zonas e imagen de pista
        // que en Jugadores. El tamaño de la burbuja es proporcional a TODOS
        // los lanzamientos recibidos desde esa zona (incluidos los que
        // acaban fuera); el color y el % que se muestra son el % de
        // paradas, que excluye los "Fuera" (ver savePct).
        function renderGkZonePositionChart(filtered) {
          const byZone = new Map();
          for (const r of filtered) {
            const code = parseZoneCode(r[COL_POSITION]);
            if (!code) continue;
            const entry = byZone.get(code) || { total: 0, paradas: 0, goles: 0 };
            entry.total++;
            if (r['Resultado'] === 'Parada') entry.paradas++;
            else if (r['Resultado'] === 'Gol') entry.goles++;
            byZone.set(code, entry);
          }

          const maxCount = Math.max(1, ...[...byZone.values()].map((z) => z.total));
          const MIN_R = 10, MAX_R = 46;
          const selectedZones = gkActiveFilters.zonaLanzamiento.selected;

          const bubblesSvg = SHOT_ZONES.map((z) => {
            const data = byZone.get(z.code);
            if (!data || data.total === 0) return '';
            const { cx, cy } = zoneCentroid(z.points);
            const r = MIN_R + (MAX_R - MIN_R) * Math.sqrt(data.total / maxCount);
            const pct = savePct(data.paradas, data.goles);
            const color = pct === null ? '#555' : efficiencyColor(pct);
            const labelBelow = cy + r + 20 <= COURT_H;
            const labelY = labelBelow ? cy + r + 14 : cy - r - 8;
            const isSelected = selectedZones.includes(z.code);
            const isDimmed = selectedZones.length > 0 && !isSelected;
            const strokeColor = isSelected ? '#ffffff' : color;
            const strokeWidth = isSelected ? 3 : 1.5;
            const label = pct === null ? `${data.total} (fuera)` : `${data.paradas}/${data.paradas + data.goles} (${pct}%)`;
            return `
              <g class="zone-bubble-clickable" data-code="${z.code}" opacity="${isDimmed ? 0.35 : 1}">
                <circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}" fill-opacity="0.8" stroke="${strokeColor}" stroke-width="${strokeWidth}">
                  <title>${escapeHtml(z.name)} — ${label}</title>
                </circle>
                <text x="${cx}" y="${labelY}" text-anchor="middle" fill="#e0e0e0" font-size="12" font-weight="600" style="pointer-events:none">${label}</text>
              </g>`;
          }).join('');

          document.getElementById('zonePositionChartGk').innerHTML = `
            <svg viewBox="0 0 ${COURT_W} ${COURT_H}" class="zone-bubble-svg" role="img" aria-label="Zona de lanzamiento rival: paradas y goles por zona">
              <image href="../assets/half-court.png" x="0" y="0" width="${COURT_W}" height="${COURT_H}" />
              ${bubblesSvg}
            </svg>`;

          wireZoneInteractions(document.querySelectorAll('#zonePositionChartGk .zone-bubble-clickable'), {
            onToggle: toggleGkZoneFilter,
            onSelectOnly: selectOnlyGkZoneFilter
          });
          document.getElementById('zonePositionClearGk').disabled = selectedZones.length === 0;
        }

        function toggleGkZoneFilter(code) {
          const cur = gkActiveFilters.zonaLanzamiento.selected;
          gkActiveFilters.zonaLanzamiento.selected = cur.includes(code) ? cur.filter((c) => c !== code) : [...cur, code];
          renderGkStats();
        }

        function selectOnlyGkZoneFilter(code) {
          gkActiveFilters.zonaLanzamiento.selected = [code];
          renderGkStats();
        }

        // ── Zona de portería: misma rejilla 3x3 + franjas de "fuera" que en
        // Jugadores, coloreada por % de paradas (excluyendo "Fuera").
        function renderGkGoalZoneChart(filtered) {
          const byZone = new Map();
          for (const r of filtered) {
            const code = GOAL_LABEL_TO_CODE[r[COL_GOAL]];
            if (!code) continue;
            const entry = byZone.get(code) || { total: 0, paradas: 0, goles: 0 };
            entry.total++;
            if (r['Resultado'] === 'Parada') entry.paradas++;
            else if (r['Resultado'] === 'Gol') entry.goles++;
            byZone.set(code, entry);
          }

          const { cols, cellW, cellH, post, outSide, outTop } = GOAL_LAYOUT;
          const gridW = cols * cellW;
          const gridH = 3 * cellH;
          const gridX = outSide + post;
          const gridY = outTop + post;
          const width = gridW + post * 2 + outSide * 2;
          const height = gridH + post * 2 + outTop;
          const selectedZones = gkActiveFilters.zonaPorteria.selected;

          function cellSvg(code, x, y, w, h) {
            const data = byZone.get(code);
            if (!data || data.total === 0) {
              return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#1c1c1c" stroke="#333" stroke-width="1" />`;
            }
            const pct = savePct(data.paradas, data.goles);
            const rgb = pct === null ? [85, 85, 85] : efficiencyColorRGB(pct);
            const fill = rgbStr(rgb);
            const textColor = textColorOn(rgb);
            const cx = x + w / 2, cy = y + h / 2;
            const isSelected = selectedZones.includes(code);
            const isDimmed = selectedZones.length > 0 && !isSelected;
            const strokeColor = isSelected ? '#ffffff' : fill;
            const strokeWidth = isSelected ? 3 : 1;
            const line1 = pct === null ? `${data.total}` : `${data.paradas}/${data.paradas + data.goles}`;
            const line2 = pct === null ? '(fuera)' : `(${pct}%)`;
            const rectSvg = `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}" fill-opacity="0.85" stroke="${strokeColor}" stroke-width="${strokeWidth}">
                  <title>${escapeHtml(GOAL_LABELS[code])} — ${line1} paradas ${line2}</title>
                </rect>`;
            // Las franjas de "fuera" (arriba/izquierda/derecha) son muy
            // finas — un lanzamiento que acaba ahí sí puede tener datos que
            // mostrar (p.ej. "Fuera arriba"), pero las dos líneas de texto a
            // tamaño normal no caben: la de arriba es baja pero ancha (una
            // sola línea más compacta cabe de sobra), las de los lados son
            // estrechas pero altas (caben las dos líneas de siempre, pero
            // más pequeñas).
            const textSvg = h < 32
              ? `<text x="${cx}" y="${cy + 3}" text-anchor="middle" fill="${textColor}" font-size="9" font-weight="700" style="pointer-events:none">${line1} ${line2}</text>`
              : w < 32
              ? `<text x="${cx}" y="${cy - 2}" text-anchor="middle" fill="${textColor}" font-size="9" font-weight="700" style="pointer-events:none">${line1}</text>
                <text x="${cx}" y="${cy + 9}" text-anchor="middle" fill="${textColor}" font-size="7.5" style="pointer-events:none">${line2.replace(/[()]/g, '')}</text>`
              : `<text x="${cx}" y="${cy - 3}" text-anchor="middle" fill="${textColor}" font-size="12" font-weight="700" style="pointer-events:none">${line1}</text>
                <text x="${cx}" y="${cy + 11}" text-anchor="middle" fill="${textColor}" font-size="10" style="pointer-events:none">${line2}</text>`;
            return `
              <g class="goal-cell-clickable" data-code="${code}" opacity="${isDimmed ? 0.35 : 1}">
                ${rectSvg}
                ${textSvg}
              </g>`;
          }

          const inner = GOAL_INNER_ZONES.map((code, i) => {
            const col = i % cols;
            const row = Math.floor(i / cols);
            return cellSvg(code, gridX + col * cellW, gridY + row * cellH, cellW, cellH);
          }).join('');

          const outer = cellSvg('out-top', gridX, 0, gridW, outTop) +
            cellSvg('out-left', 0, gridY, outSide, gridH) +
            cellSvg('out-right', gridX + gridW, gridY, outSide, gridH);

          document.getElementById('goalZoneChartGk').innerHTML = `
            <svg viewBox="0 0 ${width} ${height}" class="goal-zone-svg" role="img" aria-label="Zona de portería: paradas y goles por zona">
              ${outer}
              <rect x="${gridX - post / 2}" y="${gridY - post / 2}" width="${gridW + post}" height="${gridH + post}" fill="none" stroke="#666" stroke-width="${post}" />
              ${inner}
            </svg>`;

          wireZoneInteractions(document.querySelectorAll('#goalZoneChartGk .goal-cell-clickable'), {
            onToggle: toggleGkGoalZoneFilter,
            onSelectOnly: selectOnlyGkGoalZoneFilter
          });
          document.getElementById('goalZoneClearGk').disabled = selectedZones.length === 0;
        }

        function toggleGkGoalZoneFilter(code) {
          const cur = gkActiveFilters.zonaPorteria.selected;
          gkActiveFilters.zonaPorteria.selected = cur.includes(code) ? cur.filter((c) => c !== code) : [...cur, code];
          renderGkStats();
        }

        function selectOnlyGkGoalZoneFilter(code) {
          gkActiveFilters.zonaPorteria.selected = [code];
          renderGkStats();
        }

        // Puesto es siempre "Portero" aquí, así que la columna Jugador no
        // necesita el paréntesis con el código de puesto que sí lleva en
        // Jugadores; tampoco hay columna Mano (no aplica a un portero).
        let gkDetailSort = { key: null, dir: 'asc' };

        const GK_DETAIL_COLUMNS = [
          { key: 'partido', label: 'Partido', get: (r) => r[COL_CODE] || '' },
          { key: 'parte', label: 'Parte', get: (r) => r['Parte'] || '' },
          { key: 'tiempo', label: 'Tiempo', get: (r) => r['Tiempo de partido'] || '' },
          {
            key: 'jugador', label: 'Portero',
            get: (r) => r[COL_PLAYER] ? parsePlayer(r[COL_PLAYER]).dorsal : Infinity,
            display: (r) => r[COL_PLAYER] ? parsePlayer(r[COL_PLAYER]).label : ''
          },
          { key: 'zona', label: 'Zona', get: (r) => formatZoneLabel(r[COL_POSITION]) },
          { key: 'tipo', label: 'Tipo', get: (r) => r['Tipo de lanzamiento'] || '' },
          {
            key: 'resultado', label: 'Resultado', get: (r) => r['Resultado'] || '',
            cls: (r) => (r['Resultado'] === 'Parada' ? 'is-good' : r['Resultado'] === 'Gol' ? 'is-bad' : '')
          }
        ];

        function renderGkDetailTable(filtered) {
          const panel = document.getElementById('detailTablePanelGk');
          if (filtered.length === 0) { panel.hidden = true; return; }
          panel.hidden = false;

          let rows = [...filtered].sort((a, b) => {
            const codeA = a[COL_CODE] || '', codeB = b[COL_CODE] || '';
            if (codeA !== codeB) return codeA < codeB ? -1 : 1;
            const partA = a['Parte'] || '', partB = b['Parte'] || '';
            if (partA !== partB) return partA < partB ? -1 : 1;
            return (a['Tiempo de partido'] || '').localeCompare(b['Tiempo de partido'] || '');
          });

          if (gkDetailSort.key) {
            const col = GK_DETAIL_COLUMNS.find((c) => c.key === gkDetailSort.key);
            const dir = gkDetailSort.dir === 'desc' ? -1 : 1;
            rows = rows
              .map((r, i) => ({ r, i }))
              .sort((a, b) => {
                const va = col.get(a.r), vb = col.get(b.r);
                const cmp = typeof va === 'number' && typeof vb === 'number'
                  ? va - vb
                  : String(va).localeCompare(String(vb), 'es');
                return cmp !== 0 ? cmp * dir : a.i - b.i;
              })
              .map(({ r }) => r);
          }

          const headCells = GK_DETAIL_COLUMNS.map((col) => {
            const active = gkDetailSort.key === col.key;
            const arrow = active ? (gkDetailSort.dir === 'desc' ? ' ▼' : ' ▲') : '';
            return `<th class="sortable" data-key="${col.key}">${escapeHtml(col.label)}${arrow}</th>`;
          }).join('');
          const head = `<thead><tr>${headCells}<th>Vídeo</th></tr></thead>`;

          const videoRows = rows.filter((r) => r[COL_YOUTUBE]);
          currentVideoRows = videoRows;
          let videoCounter = 0;

          const body = rows.map((r) => {
            const cells = GK_DETAIL_COLUMNS.map((col) => {
              const value = col.display ? col.display(r) : col.get(r);
              const cls = col.cls ? col.cls(r) : '';
              return `<td class="${cls}">${escapeHtml(value)}</td>`;
            }).join('');
            const videoCell = r[COL_YOUTUBE]
              ? `<button type="button" class="video-link" data-row-idx="${videoCounter++}">▶ Ver</button>`
              : '<span class="detail-table-empty">—</span>';
            return `<tr>${cells}<td>${videoCell}</td></tr>`;
          }).join('');

          document.getElementById('detailTableGk').innerHTML = head + `<tbody>${body}</tbody>`;

          document.querySelectorAll('#detailTableGk .video-link').forEach((btn) => {
            const idx = Number(btn.dataset.rowIdx);
            btn.addEventListener('click', () => openVideoModal(videoRows[idx], idx));
          });

          document.querySelectorAll('#detailTableGk th.sortable').forEach((th) => {
            th.addEventListener('click', () => {
              const key = th.dataset.key;
              gkDetailSort = gkDetailSort.key === key
                ? { key, dir: gkDetailSort.dir === 'asc' ? 'desc' : 'asc' }
                : { key, dir: 'asc' };
              renderGkDetailTable(filtered);
            });
          });
        }

        renderGkStats();
      }
    } catch (err) {
      panels.jugadores.innerHTML = `<div class="empty-state">No se han podido cargar los datos. ${escapeHtml(err.message)}</div>`;
    }
  }
</script>
