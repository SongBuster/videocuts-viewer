<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Invitación — VideoCuts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" />
<link rel="stylesheet" href="../assets/app.css" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
<link rel="icon" href="../assets/icons/favicon-32.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="VideoCuts" />
<meta name="theme-color" content="#0d0d0d" />
</head>
<body>
  <header class="site-header">
    <h1>📊 VideoCuts</h1>
  </header>
  <div class="home-wrap">
    <div id="status" class="empty-state">Comprobando invitación…</div>
  </div>

<script type="module">
  import { requireSession, redeemInvite } from '../assets/supabase.js'

  const statusEl = document.getElementById('status')
  const token = new URLSearchParams(location.search).get('token')

  if (!token) {
    statusEl.textContent = 'Falta el token de invitación en el enlace.'
  } else {
    const session = await requireSession()
    if (session) {
      try {
        await redeemInvite(token)
        statusEl.textContent = 'Invitación aceptada — entrando…'
        location.href = 'index.html'
      } catch (err) {
        statusEl.textContent = err.message
      }
    }
  }
</script>
</body>
</html>
