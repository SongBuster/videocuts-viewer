<script>
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const PERIOD_LABELS = { first: '1ª parte', second: '2ª parte', overtime: 'Prórroga' };

  document.getElementById('matchName').textContent = DATA.matchName || 'Partido';
  document.getElementById('matchMeta').textContent =
    [DATA.competition, DATA.date, [DATA.homeTeam, DATA.awayTeam].filter(Boolean).join(' vs ')]
      .filter(Boolean).join(' · ');

  const listEl = document.getElementById('list');
  const searchEl = document.getElementById('search');
  let activeId = null;

  function render(filter) {
    const q = (filter || '').toLowerCase();
    listEl.innerHTML = '';
    for (const e of DATA.events) {
      const hay = [e.type, e.outcome, e.players, e.team, e.notes].join(' ').toLowerCase();
      if (q && !hay.includes(q)) continue;
      const row = document.createElement('div');
      row.className = 'row' + (e.id === activeId ? ' active' : '');
      row.innerHTML =
        '<div class="top">' +
          '<span class="time">' + e.absoluteTimeLabel + '</span>' +
          '<span class="badge" style="background:' + e.color + '"></span>' +
          '<span class="type">' + escapeHtml(e.type) + '</span>' +
          (e.outcome ? '<span class="outcome">' + escapeHtml(e.outcome) + '</span>' : '') +
        '</div>' +
        (e.players || e.time ? '<div class="sub">' + [e.players, PERIOD_LABELS[e.period] || '', e.time].filter(Boolean).join(' · ') + '</div>' : '') +
        (!e.youtubeId ? '<div class="unplayable">⚠ vídeo no disponible online</div>' : '');
      row.addEventListener('click', () => selectClip(e));
      listEl.appendChild(row);
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function selectClip(e) {
    activeId = e.id;
    render(searchEl.value);

    const wrap = document.getElementById('playerWrap');
    if (e.youtubeId) {
      const start = Math.max(0, Math.floor(e.start));
      const end = Math.ceil(e.end);
      wrap.innerHTML = '<iframe src="https://www.youtube.com/embed/' + e.youtubeId +
        '?start=' + start + '&end=' + end + '&autoplay=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>';
    } else {
      wrap.innerHTML = '<div class="placeholder">Este vídeo no tiene URL de YouTube asignada.</div>';
    }

    document.getElementById('detail').style.display = 'block';
    document.getElementById('detailTitle').textContent = e.type + (e.outcome ? ' — ' + e.outcome : '');
    document.getElementById('detailSub').textContent =
      [e.players, PERIOD_LABELS[e.period] || '', e.time, e.team].filter(Boolean).join(' · ');
    document.getElementById('detailNotes').textContent = e.notes || '';
    const link = document.getElementById('detailLink');
    if (e.youtubeId) {
      link.href = 'https://youtu.be/' + e.youtubeId + '?t=' + Math.max(0, Math.floor(e.start)) + 's';
      link.style.display = 'inline';
    } else {
      link.style.display = 'none';
    }
  }

  searchEl.addEventListener('input', () => render(searchEl.value));
  render('');
</script>
