<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Corte — VideoCuts</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #121212; color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  a { color: #3b82f6; }
  header {
    padding: 12px 20px; border-bottom: 1px solid #2a2a2a;
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  }
  header a.back { color: #888; font-size: 12px; text-decoration: none; }
  header a.back:hover { color: #ccc; }
  header .match-name { color: #aaa; font-size: 13px; }
  header .meta { color: #555; font-size: 12px; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 20px 50px; display: flex; flex-direction: column; gap: 18px; }

  .title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .badge { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .title-row h1 { color: #fff; font-size: 22px; margin: 0; }
  .title-row .outcome { color: #aaa; font-size: 16px; }

  .player-wrap {
    aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .player-wrap iframe { width: 100%; height: 100%; border: none; }
  .placeholder { color: #555; font-size: 14px; text-align: center; padding: 30px; }

  .info-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px;
    background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; padding: 16px 20px;
  }
  .info-grid .field .label { color: #666; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; margin-bottom: 3px; }
  .info-grid .field .value { color: #e0e0e0; font-size: 14px; }

  .notes { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; padding: 14px 20px; color: #ccc; font-size: 13px; line-height: 1.5; }
  .notes .label { color: #666; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; margin-bottom: 6px; }

  .links { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; }
  .links a { text-decoration: none; }
  .links a:hover { text-decoration: underline; }

  .empty-state { color: #666; font-size: 14px; text-align: center; padding: 60px 20px; }
</style>
</head>
<body>
  <header>
    <a class="back" href="index.html">← Partidos</a>
    <span class="match-name" id="matchName"></span>
    <span class="meta" id="matchMeta"></span>
  </header>
  <main id="main">
    <div class="empty-state">Cargando…</div>
  </main>

<script type="module">
  import { fetchJSON, escapeHtml, formatDateEs, PERIOD_LABELS, GOAL_LABELS } from './assets/app.js'

  const params = new URLSearchParams(location.search)
  const matchId = params.get('id')
  const eventId = params.get('evento')
  const main = document.getElementById('main')

  function showError(msg) {
    main.innerHTML = `<div class="empty-state">${escapeHtml(msg)}</div>`
  }

  if (!matchId || !eventId) {
    showError('Falta ?id=<partido>&evento=<corte> en la URL.')
  } else {
    try {
      const data = await fetchJSON(`data/${encodeURIComponent(matchId)}.json`)
      const e = data.events.find((ev) => ev.id === eventId)
      if (!e) {
        showError('No se ha encontrado ese corte en este partido.')
      } else {
        document.title = `${e.type}${e.outcome ? ' — ' + e.outcome : ''} — VideoCuts`
        document.getElementById('matchName').textContent = data.matchName || 'Partido'
        document.getElementById('matchMeta').textContent =
          [formatDateEs(data.date), data.competition].filter(Boolean).join(' · ')

        const playerHtml = e.youtubeId
          ? `<iframe src="https://www.youtube.com/embed/${e.youtubeId}?start=${Math.max(0, Math.floor(e.start))}&end=${Math.ceil(e.end)}&autoplay=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`
          : `<div class="placeholder">Este vídeo no tiene URL de YouTube asignada.</div>`

        const fields = [
          ['Equipo', e.team],
          ['Jugador(es)', e.players],
          ['Parte', PERIOD_LABELS[e.period] || ''],
          ['Tiempo de partido', e.matchTime],
          ['Tiempo del partido (acumulado)', e.absoluteTimeLabel],
          ['Zona de lanzamiento', e.zoneName],
          ['Zona de portería', e.goalZone ? (GOAL_LABELS[e.goalZone] || e.goalZone) : '']
        ].filter(([, v]) => v)

        main.innerHTML = `
          <div class="title-row">
            <span class="badge" style="background:${e.color}"></span>
            <h1>${escapeHtml(e.type)}</h1>
            ${e.outcome ? `<span class="outcome">${escapeHtml(e.outcome)}</span>` : ''}
          </div>
          <div class="player-wrap">${playerHtml}</div>
          <div class="info-grid">
            ${fields.map(([label, value]) => `
              <div class="field">
                <div class="label">${escapeHtml(label)}</div>
                <div class="value">${escapeHtml(value)}</div>
              </div>`).join('')}
          </div>
          ${e.notes ? `<div class="notes"><div class="label">Notas</div>${escapeHtml(e.notes)}</div>` : ''}
          <div class="links">
            <a href="partido.html?id=${encodeURIComponent(matchId)}&evento=${encodeURIComponent(eventId)}">↩ Ver este partido completo</a>
            ${e.youtubeId ? `<a href="https://youtu.be/${e.youtubeId}?t=${Math.max(0, Math.floor(e.start))}s" target="_blank" rel="noopener">Abrir en YouTube ↗</a>` : ''}
          </div>`
      }
    } catch (err) {
      showError('No se ha podido cargar este partido. ' + err.message)
    }
  }
</script>
</body>
</html>
