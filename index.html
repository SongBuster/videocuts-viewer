<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VideoCuts — Estadísticas</title>
<link rel="stylesheet" href="assets/app.css" />
</head>
<body>
  <header class="site-header">
    <h1>📊 VideoCuts</h1>
    <span class="meta">Elige el rival para ver sus estadísticas</span>
  </header>
  <div class="home-wrap">
    <p class="intro">Todo lo que veas a continuación está filtrado por el rival que elijas aquí.</p>
    <div id="rivals" class="match-grid"></div>
  </div>

<script type="module">
  import { fetchJSON, escapeHtml } from './assets/app.js'

  const el = document.getElementById('rivals')
  try {
    const index = await fetchJSON('data/lanzamientos/index.json')
    const byTeam = new Map()
    for (const entry of index) {
      const t = byTeam.get(entry.team) || { team: entry.team, rows: 0, jornadas: new Set() }
      t.rows += entry.rowCount
      t.jornadas.add(entry.code)
      byTeam.set(entry.team, t)
    }
    const rivals = [...byTeam.values()].sort((a, b) => a.team.localeCompare(b.team))

    if (rivals.length === 0) {
      el.innerHTML = '<div class="empty-state">Todavía no hay ningún rival cargado. Genera y sube el primer CSV con el generador.</div>'
    } else {
      el.innerHTML = rivals.map((r) => `
        <a class="match-card" href="rival.html?equipo=${encodeURIComponent(r.team)}">
          <div class="name">${escapeHtml(r.team)}</div>
          <div class="figures">
            <span><b>${r.jornadas.size}</b> jornada${r.jornadas.size === 1 ? '' : 's'}</span>
            <span><b>${r.rows}</b> filas</span>
          </div>
        </a>`).join('')
    }
  } catch (err) {
    el.innerHTML = `<div class="empty-state">Todavía no hay ningún rival cargado. Genera y sube el primer CSV con el generador.</div>`
  }
</script>
</body>
</html>
