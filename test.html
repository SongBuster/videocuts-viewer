<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Prueba inserción YouTube</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #121212; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 14px 20px; border-bottom: 1px solid #2a2a2a; flex-shrink: 0; }
  header h1 { font-size: 16px; margin: 0; color: #fff; }
  header p { color: #f59e0b; font-size: 12px; margin: 6px 0 0; }
  .layout { flex: 1; display: flex; min-height: 0; }
  .sidebar { width: 320px; flex-shrink: 0; border-right: 1px solid #2a2a2a; }
  .row { padding: 10px 14px; border-bottom: 1px solid #1e1e1e; cursor: pointer; }
  .row:hover, .row.active { background: #1e2a3a; }
  .row .type { font-weight: 600; font-size: 13px; }
  .row .sub { color: #888; font-size: 11px; margin-top: 3px; }
  .main { flex: 1; background: #000; display: flex; align-items: center; justify-content: center; }
  .main iframe { width: 100%; height: 100%; border: none; }
  .placeholder { color: #555; font-size: 13px; }
</style>
</head>
<body>
  <header>
    <h1>Prueba de inserción de YouTube (alojado en GitHub Pages)</h1>
    <p>Si esto reproduce el vídeo, confirma que GitHub Pages sí sirve para el visor compartible.</p>
  </header>
  <div class="layout">
    <div class="sidebar" id="list"></div>
    <div class="main" id="player"><div class="placeholder">Elige un corte de prueba</div></div>
  </div>
<script id="data" type="application/json">{"events":[{"id":"1","type":"Lanzamiento","color":"#3b82f6","outcome":"Gol","players":"#44 Jugador de prueba","time":"00:21","youtubeId":"jNQXAC9IVRw","start":3,"end":12},{"id":"2","type":"Lanzamiento 7M","color":"#f59e0b","outcome":"Parada","players":"#11 Otro jugador","time":"05:10","youtubeId":"jNQXAC9IVRw","start":8,"end":15}]}</script>
<script>
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const list = document.getElementById('list');
  DATA.events.forEach((e) => {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = '<div class="type">' + e.type + ' — ' + e.outcome + '</div><div class="sub">' + e.players + ' · ' + e.time + '</div>';
    row.onclick = () => {
      document.querySelectorAll('.row').forEach((r) => r.classList.remove('active'));
      row.classList.add('active');
      document.getElementById('player').innerHTML = '<iframe src="https://www.youtube.com/embed/' + e.youtubeId + '?start=' + e.start + '&end=' + e.end + '&autoplay=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>';
    };
    list.appendChild(row);
  });
</script>
</body>
</html>
